name: Apply fullscreen-only UI

on:
  push:
    branches:
      - fix/fullscreen-only-ui

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[fullscreen-only applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fullscreen-only-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply source changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, content: str) -> None:
              Path(path).write_text(content)

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:120]!r}")
              write(path, content.replace(old, new, 1))

          def regex_replace_once(path: str, pattern: str, replacement: str) -> None:
              content = read(path)
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected exactly one regex match in {path}, found {count}: {pattern}")
              write(path, updated)

          args_path = "packages/coding-agent/src/cli/args.ts"
          replace_once(args_path, 'import type { UiMode } from "../core/settings-manager.ts";\n', '')
          replace_once(args_path, '\tuiMode?: UiMode;\n', '')
          regex_replace_once(
              args_path,
              r'\t\t\} else if \(arg === "--ui-mode"\) \{.*?\n\t\t\} else if \(arg === "--verbose"\) \{',
              '''\t\t} else if (arg === "--ui-mode") {
\t\t\tconst mode = args[i + 1];
\t\t\tif (mode === undefined || mode.startsWith("-")) {
\t\t\t\tresult.diagnostics.push({
\t\t\t\t\ttype: "error",
\t\t\t\t\tmessage: "--ui-mode is unavailable; pi-claude always uses fullscreen",
\t\t\t\t});
\t\t\t} else {
\t\t\t\ti++;
\t\t\t\tif (mode !== "fullscreen") {
\t\t\t\t\tresult.diagnostics.push({
\t\t\t\t\t\ttype: "error",
\t\t\t\t\t\tmessage: "--ui-mode is unavailable; pi-claude always uses fullscreen",
\t\t\t\t\t});
\t\t\t\t}
\t\t\t}
\t\t} else if (arg === "--alt") {
\t\t\t// Legacy compatibility no-op: fullscreen is always enabled in pi-claude.
\t\t} else if (arg === "--verbose") {''',
          )
          replace_once(
              args_path,
              '  --ui-mode <mode>               UI mode: regular (default) or fullscreen\n',
              '',
          )

          replace_once(
              "packages/coding-agent/src/main.ts",
              '\t\t\tuiMode: parsed.uiMode,\n',
              '',
          )

          replace_once(
              "packages/coding-agent/src/core/settings-manager.ts",
              '''\tgetUiMode(): UiMode {
\t\treturn this.settings.uiMode === "fullscreen" ? "fullscreen" : "regular";
\t}

\tsetUiMode(mode: UiMode): void {
\t\tthis.globalSettings.uiMode = mode;
\t\tthis.markModified("uiMode");
\t\tthis.save();
\t}
''',
              '''\tgetUiMode(): UiMode {
\t\treturn "fullscreen";
\t}

\tsetUiMode(_mode: UiMode): void {
\t\t// Pi-Claude intentionally fixes the terminal renderer to fullscreen.
\t}
''',
          )

          regex_replace_once(
              "packages/coding-agent/src/modes/interactive/components/settings-selector.ts",
              r'\n\t\t\t\{\n\t\t\t\tid: "ui-mode",\n\t\t\t\tlabel: "UI mode",\n\t\t\t\tdescription: "Interface layout used after restart; fullscreen mode is experimental",\n\t\t\t\tcurrentValue: config\.uiMode,\n\t\t\t\tvalues: \["regular", "fullscreen"\],\n\t\t\t\},',
              '',
          )

          replace_once(
              "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
              '''\t\tconst uiMode = options.uiMode ?? this.settingsManager.getUiMode();
\t\tthis.options = { ...options, uiMode };
''',
              '''\t\tconst uiMode: UiMode = "fullscreen";
\t\tthis.options = { ...options, uiMode };
''',
          )

          regex_replace_once(
              "packages/coding-agent/test/args.test.ts",
              r'\n\tdescribe\("--ui-mode flag", \(\) => \{.*?\n\t\}\);\n\n(?=\tdescribe\("tool flags")',
              '''
\tdescribe("fixed fullscreen UI", () => {
\t\ttest("accepts the legacy fullscreen value as a no-op", () => {
\t\t\tconst result = parseArgs(["--ui-mode", "fullscreen"]);
\t\t\texpect(result.diagnostics).toEqual([]);
\t\t\texpect(result).not.toHaveProperty("uiMode");
\t\t});

\t\ttest("rejects attempts to select regular mode", () => {
\t\t\tconst result = parseArgs(["--ui-mode", "regular"]);
\t\t\texpect(result.diagnostics).toEqual([
\t\t\t\t{ type: "error", message: "--ui-mode is unavailable; pi-claude always uses fullscreen" },
\t\t\t]);
\t\t});

\t\ttest("rejects other UI mode values", () => {
\t\t\tconst result = parseArgs(["--ui-mode", "other"]);
\t\t\texpect(result.diagnostics).toEqual([
\t\t\t\t{ type: "error", message: "--ui-mode is unavailable; pi-claude always uses fullscreen" },
\t\t\t]);
\t\t});

\t\ttest("requires a value for the legacy UI mode flag", () => {
\t\t\tconst result = parseArgs(["--ui-mode"]);
\t\t\texpect(result.diagnostics).toEqual([
\t\t\t\t{ type: "error", message: "--ui-mode is unavailable; pi-claude always uses fullscreen" },
\t\t\t]);
\t\t});

\t\ttest("accepts --alt as a compatibility no-op", () => {
\t\t\tconst result = parseArgs(["--alt"]);
\t\t\texpect(result.diagnostics).toEqual([]);
\t\t\texpect(result.unknownFlags.has("alt")).toBe(false);
\t\t\texpect(result).not.toHaveProperty("uiMode");
\t\t});
\t});

''',
          )

          settings_test = "packages/coding-agent/test/settings-manager.test.ts"
          content = read(settings_test)
          marker = "\n});\n"
          if not content.endswith(marker):
              raise SystemExit(f"Unexpected end of {settings_test}")
          addition = '''

\tdescribe("fixed fullscreen UI", () => {
\t\tit("ignores a persisted regular UI mode", () => {
\t\t\twriteFileSync(join(agentDir, "settings.json"), JSON.stringify({ uiMode: "regular" }));
\t\t\tconst manager = SettingsManager.create(projectDir, agentDir);
\t\t\texpect(manager.getUiMode()).toBe("fullscreen");
\t\t});

\t\tit("does not persist attempts to change the UI mode", async () => {
\t\t\tconst settingsPath = join(agentDir, "settings.json");
\t\t\twriteFileSync(settingsPath, JSON.stringify({ theme: "dark" }));
\t\t\tconst manager = SettingsManager.create(projectDir, agentDir);
\t\t\tmanager.setUiMode("regular");
\t\t\tawait manager.flush();
\t\t\texpect(manager.getUiMode()).toBe("fullscreen");
\t\t\texpect(JSON.parse(readFileSync(settingsPath, "utf-8"))).toEqual({ theme: "dark" });
\t\t});
\t});
'''
          write(settings_test, content[:-len(marker)] + addition + marker)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format and lint changed files
        run: >-
          npx biome check --write --error-on-warnings
          packages/coding-agent/src/cli/args.ts
          packages/coding-agent/src/main.ts
          packages/coding-agent/src/core/settings-manager.ts
          packages/coding-agent/src/modes/interactive/components/settings-selector.ts
          packages/coding-agent/src/modes/interactive/interactive-mode.ts
          packages/coding-agent/test/args.test.ts
          packages/coding-agent/test/settings-manager.test.ts

      - name: Run focused tests
        run: npm --workspace=@doubleflower/pi-claude test -- test/args.test.ts test/settings-manager.test.ts

      - name: Type-check coding agent
        run: npx tsgo --noEmit -p packages/coding-agent/tsconfig.json

      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/apply-fullscreen-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(coding-agent): lock UI to fullscreen [fullscreen-only applied]"
          git push origin HEAD:fix/fullscreen-only-ui
