name: Validate internal tool call rendering

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/internal-tool-call-rendering
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run focused regressions
        run: npx vitest --run packages/coding-agent/test/tool-execution-spacing.test.ts packages/coding-agent/test/plan-mode.test.ts

      - name: Remove temporary validation workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-internal-tool-call-rendering.yml
          git commit -m "chore: remove focused internal tool validation workflow"
          git push origin HEAD:fix/internal-tool-call-rendering
