name: Apply plan clean-session metadata fix

on:
  push:
    branches:
      - fix/plan-clean-session-metadata

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Apply source patch
        run: |
          git apply --check .github/patches/plan-clean-session-metadata.patch
          git apply .github/patches/plan-clean-session-metadata.patch
          rm .github/patches/plan-clean-session-metadata.patch
          rm .github/workflows/apply-plan-clean-session-metadata.yml

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run focused tests
        run: >-
          npx vitest --run
          packages/coding-agent/test/plan-mode-session-handoff.test.ts
          packages/coding-agent/test/plan-mode-clear-context-termination.test.ts
          packages/coding-agent/test/plan-mode.test.ts

      - name: Build workspace
        run: npm run build

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(coding-agent): detach and name clean plan sessions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
