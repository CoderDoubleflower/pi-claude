name: Fix PR 45 plan context compatibility

on:
  pull_request_target:
    types: [ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-validate:
    if: github.event.pull_request.number == 45
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/plan-clear-context-session-clean
          fetch-depth: 0

      - name: Apply compatibility fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              path.write_text(text.replace(old, new, 1))

          types = Path("packages/coding-agent/src/core/extensions/types.ts")
          replace_once(
              types,
              "\tnewSession(options?: {\n\t\tparentSession?: string;\n\t\tsetup?: (sessionManager: SessionManager) => Promise<void>;\n\t\twithSession?: (ctx: ReplacedSessionContext) => Promise<void>;\n\t}): Promise<{ cancelled: boolean }>;\n\t/** Get the current effective system prompt. */",
              "\tnewSession?(options?: {\n\t\tparentSession?: string;\n\t\tsetup?: (sessionManager: SessionManager) => Promise<void>;\n\t\twithSession?: (ctx: ReplacedSessionContext) => Promise<void>;\n\t}): Promise<{ cancelled: boolean }>;\n\t/** Get the current effective system prompt. */",
          )

          plan = Path("packages/coding-agent/src/extensions/plan-mode/index.ts")
          replace_once(
              plan,
              '''\t\tsetTimeout(() => {
\t\t\tlet deliveredInFreshSession = false;
\t\t\tvoid ctx
\t\t\t\t.newSession({
''',
              '''\t\tsetTimeout(() => {
\t\t\tconst startFreshSession = ctx.newSession;
\t\t\tif (!startFreshSession) {
\t\t\t\tdeliverInCurrentSession("Context clear is unavailable; starting implementation in the current context.");
\t\t\t\treturn;
\t\t\t}
\t\t\tlet deliveredInFreshSession = false;
\t\t\tvoid startFreshSession({
''',
          )
          PY

          rm -f .github/trigger-plan-clear-context-compat

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed files
        run: npx biome check --write --error-on-warnings packages/coding-agent/src/core/extensions/types.ts packages/coding-agent/src/extensions/plan-mode/index.ts

      - name: Build
        run: npm run build

      - name: Run focused tests
        run: npx vitest --run packages/coding-agent/test/plan-mode.test.ts packages/coding-agent/test/plan-mode-shortcut.test.ts

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A packages/coding-agent/src .github
          git commit -m "fix(coding-agent): make plan context replacement capability optional"
          git push origin HEAD:feat/plan-clear-context-session-clean

      - name: Remove temporary main-branch files
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=false
          for path in \
            .github/workflows/fix-pr45-plan-context.yml \
            .github/workflows/fix-plan-clear-context-push.yml \
            .github/workflows/fix-plan-clear-context-optional.yml \
            .github/workflows/finalize-plan-clear-context-pr.yml \
            .github/trigger-plan-clear-context-push; do
            if [ -f "$path" ]; then
              git rm "$path"
              changed=true
            fi
          done
          if [ "$changed" = true ]; then
            git commit -m "chore: remove plan clear-context fix runners"
            git push origin main
          fi
