name: Apply plan clear-context feature branch patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/plan-clear-context-session
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              path.write_text(text.replace(old, new, 1))

          types = Path("packages/coding-agent/src/core/extensions/types.ts")
          replace_once(
              types,
              "\t/** Trigger compaction without awaiting completion. */\n\tcompact(options?: CompactOptions): void;\n\t/** Get the current effective system prompt. */\n",
              "\t/** Trigger compaction without awaiting completion. */\n\tcompact(options?: CompactOptions): void;\n\t/**\n\t * Start a fresh session after an explicit user-approved transition.\n\t * Event handlers must only call this after the agent has settled; post-replacement\n\t * work belongs in withSession because the current extension context becomes stale.\n\t */\n\tnewSession(options?: {\n\t\tparentSession?: string;\n\t\tsetup?: (sessionManager: SessionManager) => Promise<void>;\n\t\twithSession?: (ctx: ReplacedSessionContext) => Promise<void>;\n\t}): Promise<{ cancelled: boolean }>;\n\t/** Get the current effective system prompt. */\n",
          )

          runner = Path("packages/coding-agent/src/core/extensions/runner.ts")
          replace_once(
              runner,
              "\t\t\tcompact: (options) => {\n\t\t\t\trunner.assertActive();\n\t\t\t\trunner.compactFn(options);\n\t\t\t},\n\t\t\tgetSystemPrompt: () => {\n",
              "\t\t\tcompact: (options) => {\n\t\t\t\trunner.assertActive();\n\t\t\t\trunner.compactFn(options);\n\t\t\t},\n\t\t\tnewSession: (options) => {\n\t\t\t\trunner.assertActive();\n\t\t\t\treturn runner.newSessionHandler(options);\n\t\t\t},\n\t\t\tgetSystemPrompt: () => {\n",
          )

          plan = Path("packages/coding-agent/src/extensions/plan-mode/index.ts")
          text = plan.read_text()
          text = text.replace(
              "User approved the plan and requested a clean execution context. End this turn now; implementation will start after compaction.",
              "User approved the plan and requested a clean execution context. End this turn now; implementation will start in a fresh session.",
              1,
          ).replace(
              "Context will be compacted before implementation.",
              "Context will be cleared before implementation.",
              1,
          )
          start_marker = '\tpi.on("agent_settled", (_event, ctx) => {'
          end_marker = '\n\n\tpi.on("session_compact", () => {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''\tpi.on("agent_settled", (_event, ctx) => {
\t\tif (state.phase !== "awaiting-clear-context" || !state.pendingExecution) return;
\t\tconst pending = state.pendingExecution;
\t\tconst savedTools = state.toolsBeforePlan;
\t\tconst parentSession = ctx.sessionManager.getSessionFile();
\t\tstate = {
\t\t\t...state,
\t\t\tphase: "inactive",
\t\t\ttoolsBeforePlan: undefined,
\t\t\thasExitedInSession: true,
\t\t\tneedsExitReminder: false,
\t\t\treentryPending: false,
\t\t\tforceFullReminder: false,
\t\t\tpendingExecution: undefined,
\t\t};
\t\trestoreNormalTools(savedTools);
\t\tpersistState();
\t\tupdateStatus(ctx);

\t\tconst buildExecutionMessage = (subtitle: string) => ({
\t\t\tcustomType: PLAN_MODE_EXECUTION_TYPE,
\t\t\tcontent: buildApprovedExecutionPrompt(pending.planPath, pending.plan),
\t\t\tdisplay: true,
\t\t\tdetails: {
\t\t\t\tkind: "approved",
\t\t\t\ttitle: "User approved Claude's plan",
\t\t\t\tsubtitle,
\t\t\t\tplanPath: pending.planPath,
\t\t\t\tplan: pending.plan,
\t\t\t} satisfies PlanRenderDetails,
\t\t});
\t\tconst deliverInCurrentSession = (subtitle: string) => {
\t\t\ttry {
\t\t\t\tpi.sendMessage(buildExecutionMessage(subtitle), { triggerTurn: true });
\t\t\t} catch {
\t\t\t\treturn;
\t\t\t}
\t\t};

\t\t// Session replacement invalidates this extension runner. Defer it until the
\t\t// current agent_settled event has fully unwound, then do all post-switch work
\t\t// through the fresh context supplied to withSession.
\t\tsetTimeout(() => {
\t\t\tlet deliveredInFreshSession = false;
\t\t\tvoid ctx
\t\t\t\t.newSession({
\t\t\t\t\tparentSession: parentSession ?? undefined,
\t\t\t\t\twithSession: async (nextCtx) => {
\t\t\t\t\t\tdeliveredInFreshSession = true;
\t\t\t\t\t\tawait nextCtx.sendMessage(buildExecutionMessage("Starting implementation with a clean context."), {
\t\t\t\t\t\t\ttriggerTurn: true,
\t\t\t\t\t\t});
\t\t\t\t\t},
\t\t\t\t})
\t\t\t\t.then((result) => {
\t\t\t\t\tif (result.cancelled || !deliveredInFreshSession) {
\t\t\t\t\t\tdeliverInCurrentSession(
\t\t\t\t\t\t\tresult.cancelled
\t\t\t\t\t\t\t\t? "Context clear was cancelled; starting implementation in the current context."
\t\t\t\t\t\t\t\t: "Context clear is unavailable; starting implementation in the current context.",
\t\t\t\t\t\t);
\t\t\t\t\t}
\t\t\t\t})
\t\t\t\t.catch(() => {
\t\t\t\t\tdeliverInCurrentSession("Context clear failed; starting implementation in the current context.");
\t\t\t\t});
\t\t}, 0);
\t});'''
          plan.write_text(text[:start] + replacement + text[end:])

          test = Path("packages/coding-agent/test/plan-mode.test.ts")
          text = test.read_text().replace(
              'import { existsSync, mkdtempSync, rmSync } from "node:fs";',
              'import { existsSync, mkdtempSync, readFileSync, rmSync } from "node:fs";',
              1,
          )
          insertion = '''

\tit("uses a fresh session instead of compaction for clear-context plan approval", () => {
\t\tconst source = readFileSync(new URL("../src/extensions/plan-mode/index.ts", import.meta.url), "utf8");
\t\texpect(source).toContain(".newSession({");
\t\texpect(source).toContain("Starting implementation with a clean context.");
\t\texpect(source).not.toContain("ctx.compact({");
\t\texpect(source).not.toContain("implementation will start after compaction");
\t\texpect(source).not.toContain("Starting implementation with a compacted context.");
\t});'''
          close = "\n});\n"
          index = text.rfind(close)
          if index < 0:
              raise SystemExit("Could not find plan-mode test suite closing marker")
          test.write_text(text[:index] + insertion + text[index:])
          PY

          git rm .github/workflows/patch-plan-clear-context-session.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src/core/extensions/types.ts \
                  packages/coding-agent/src/core/extensions/runner.ts \
                  packages/coding-agent/src/extensions/plan-mode/index.ts \
                  packages/coding-agent/test/plan-mode.test.ts
          git commit -m "feat(coding-agent): execute approved plans in a fresh context"
          git push origin HEAD:feat/plan-clear-context-session

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run focused tests
        run: npx vitest --run packages/coding-agent/test/plan-mode.test.ts packages/coding-agent/test/plan-mode-shortcut.test.ts

      - name: Remove trigger workflow from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/trigger-plan-clear-context-session-v2.yml ]; then
            git rm .github/workflows/trigger-plan-clear-context-session-v2.yml
            git commit -m "chore: remove plan clear-context patch trigger"
            git push origin main
          fi
