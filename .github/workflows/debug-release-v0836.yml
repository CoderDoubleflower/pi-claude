name: Debug pi-claude v0.83.6 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/debug-release-v0836.yml

permissions:
  actions: read
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Record recent workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --limit 20 --json databaseId,name,displayTitle,event,status,conclusion,createdAt,updatedAt,headSha,url > .github/release-v0836-debug.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-v0836-debug.json
          git commit -m "chore: record v0.83.6 workflow diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
