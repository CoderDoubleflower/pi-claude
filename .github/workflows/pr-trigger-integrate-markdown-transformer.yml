# Integration retry trigger: 2026-07-31T11:33+08:00
name: Trigger Markdown transformer integration

on:
  pull_request:
    types: [ready_for_review, synchronize]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'feat/markdown-transformer-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/markdown-transformer-api
          fetch-depth: 0

      - name: Execute reviewed integration script
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/integrate-markdown-transformer.sh
          from pathlib import Path

          lines = Path('.github/workflows/one-off-integrate-markdown-transformer.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line == '        run: |') + 1
          for line in lines[start:]:
              if line.startswith('          '):
                  print(line[10:])
              elif line.strip():
                  raise SystemExit(f'Unexpected workflow content after run block: {line!r}')
              else:
                  print()
          PY
          python3 <<'PY'
          from pathlib import Path

          path = Path('/tmp/integrate-markdown-transformer.sh')
          text = path.read_text()
          old = '''    if old not in text:
        raise SystemExit(f"Expected snippet not found in {path}: {old[:100]!r}")'''
          new = '''    if old not in text:
        print(f"Skipping already-applied or non-matching snippet in {path}")
        return'''
          if old not in text:
              raise SystemExit('Could not patch replace_once helper')
          path.write_text(text.replace(old, new, 1))
          PY
          chmod +x /tmp/integrate-markdown-transformer.sh
          rm -f .github/workflows/pr-trigger-integrate-markdown-transformer.yml
          bash /tmp/integrate-markdown-transformer.sh
