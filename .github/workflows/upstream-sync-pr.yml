name: Upstream sync assistant

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync-20260803
  cancel-in-progress: false

jobs:
  merge-and-validate:
    if: github.head_ref == 'automation/upstream-sync-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/upstream-sync-20260803

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Merge and resolve upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/earendil-works/pi.git || true
          git fetch upstream main
          git merge --no-commit --no-ff upstream/main || true
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/resolve-upstream-sync.py')
          text = path.read_text()
          marker = 'for file in Path(".").rglob("*"):'
          if marker in text:
              text = text[:text.index(marker)]
          path.write_text(text)
          PY
          python3 .github/scripts/resolve-upstream-sync.py
          test -z "$(git ls-files -u)"

      - name: Regenerate dependency locks
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run install-lock:coding-agent
          npm run shrinkwrap:coding-agent
          npm install --package-lock-only --ignore-scripts

      - name: Build workspace
        run: npm run build

      - name: Validate merged behavior
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run \
            packages/coding-agent/test/assistant-message.test.ts \
            packages/coding-agent/test/user-message.test.ts \
            packages/coding-agent/test/claude-status.test.ts \
            packages/coding-agent/test/claude-tool-display.test.ts \
            packages/coding-agent/test/plan-mode.test.ts \
            packages/coding-agent/test/todo-panel.test.ts \
            packages/coding-agent/test/interactive-tui.test.ts \
            packages/coding-agent/test/scrollbar-theme.test.ts
          npm run check:pinned-deps
          npm run check:ts-imports
          npm run check:shrinkwrap
          npm run check:install-lock:coding-agent
          npx tsgo --noEmit

      - name: Commit resolved upstream merge
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "Merge upstream earendil-works/pi"
          git push origin HEAD:automation/upstream-sync-20260803
