name: Apply validated upstream batch 1 source files

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-batch1-20260805
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: CoderDoubleflower/pi-claude
          BRANCH: sync/upstream-batch1-20260805
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          replacements = {
              Path("packages/ai/test/context-overflow.test.ts"): [
                  ("gemini-2.5-pro - should detect overflow via isContextOverflow", "gemini-3.1-pro-preview - should detect overflow via isContextOverflow"),
                  ('getModel("github-copilot", "gemini-2.5-pro")', 'getModel("github-copilot", "gemini-3.1-pro-preview")'),
              ],
              Path("packages/ai/test/openai-completions-tool-choice.test.ts"): [
                  ('getModel("groq", "qwen/qwen3-32b")', 'getModel("groq", "qwen/qwen3.6-27b")'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f"Unexpected occurrence count for {old!r} in {path}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          update_file() {
            local path="$1"
            local sha content
            sha=$(gh api "repos/${REPO}/contents/${path}?ref=${BRANCH}" --jq .sha)
            content=$(base64 -w0 "$path")
            gh api --method PUT "repos/${REPO}/contents/${path}" \
              -f message='fix(ai): refresh model catalog regression IDs' \
              -f branch="$BRANCH" \
              -f sha="$sha" \
              -f content="$content" >/dev/null
          }

          update_file packages/ai/test/context-overflow.test.ts
          update_file packages/ai/test/openai-completions-tool-choice.test.ts
