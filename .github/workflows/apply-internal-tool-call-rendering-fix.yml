name: Apply internal tool call rendering fix

on:
  push:
    branches:
      - fix/internal-tool-call-rendering

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/internal-tool-call-rendering
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply source and test changes
        run: node scripts/apply-internal-tool-call-rendering-fix.mjs

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply-internal-tool-call-rendering-fix.mjs
          rm .github/workflows/apply-internal-tool-call-rendering-fix.yml

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(coding-agent): preserve internal tool result UI"
          git push origin HEAD:fix/internal-tool-call-rendering
