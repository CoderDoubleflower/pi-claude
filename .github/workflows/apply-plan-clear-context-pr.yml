name: Apply plan clear-context PR patch

on:
  pull_request_target:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/plan-clear-context-session'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/plan-clear-context-session
          fetch-depth: 0

      - name: Apply prepared patch
        id: patch
        shell: bash
        run: |
          if [ ! -f .github/workflows/patch-plan-clear-context-session.yml ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          git show origin/main:.github/workflows/trigger-plan-clear-context-session-v2.yml > /tmp/trigger.yml
          python3 <<'PY'
          from pathlib import Path

          text = Path('/tmp/trigger.yml').read_text()
          step = text.index('      - name: Apply source changes\n')
          start = text.index('        run: |\n', step) + len('        run: |\n')
          end = text.index('\n      - name: Set up Node.js\n', start)
          block = text[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-plan-clear-context.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-plan-clear-context.sh
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Remove feature trigger marker
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          if [ -f .github/trigger-plan-clear-context-pr ]; then
            git rm .github/trigger-plan-clear-context-pr
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove plan clear-context PR trigger"
            git push origin HEAD:feat/plan-clear-context-session
          fi

      - name: Set up Node.js
        if: steps.patch.outputs.applied == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.patch.outputs.applied == 'true'
        run: npm ci --ignore-scripts

      - name: Build
        if: steps.patch.outputs.applied == 'true'
        run: npm run build

      - name: Run focused tests
        if: steps.patch.outputs.applied == 'true'
        run: npx vitest --run packages/coding-agent/test/plan-mode.test.ts packages/coding-agent/test/plan-mode-shortcut.test.ts

      - name: Remove one-time main-branch files
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=false
          for path in \
            .github/workflows/apply-plan-clear-context-pr.yml \
            .github/workflows/trigger-plan-clear-context-session-v2.yml \
            .github/trigger-plan-clear-context-session-v2; do
            if [ -f "$path" ]; then
              git rm "$path"
              changed=true
            fi
          done
          if [ "$changed" = true ]; then
            git commit -m "chore: remove plan clear-context patch runners"
            git push origin main
          fi
