name: Workspace install smoke package

on:
  push:
    branches:
      - automation/workspace-install-20260731
  pull_request:
    branches:
      - automation/workspace-install-base-20260731

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build release packages
        run: npm run build

      - name: Pack runtime packages
        run: |
          mkdir -p artifacts
          for package_dir in packages/tui packages/ai packages/agent packages/coding-agent; do
            (cd "$package_dir" && npm pack --pack-destination ../../artifacts)
          done
          npm pack ./node_modules/@silvia-odwyer/photon-node --pack-destination artifacts
          ls -lah artifacts

      - name: Upload npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: pi-claude-runtime-tarballs
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1
