name: Workspace install smoke package

on:
  push:
    branches:
      - automation/workspace-install-20260731
  pull_request:
    branches:
      - automation/workspace-install-base-20260731

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build release package
        run: npm run build

      - name: Pack pi-claude
        run: |
          mkdir -p artifacts
          (cd packages/coding-agent && npm pack --pack-destination ../../artifacts)

      - name: Create installed global prefix
        run: |
          mkdir -p portable-prefix
          npm install -g --ignore-scripts --prefix "$PWD/portable-prefix" ./artifacts/doubleflower-pi-claude-0.83.2.tgz
          "$PWD/portable-prefix/bin/pi-claude" --version
          tar -czf artifacts/pi-claude-portable-prefix.tar.gz -C portable-prefix .
          ls -lah artifacts/pi-claude-portable-prefix.tar.gz

      - name: Upload installed prefix
        uses: actions/upload-artifact@v4
        with:
          name: pi-claude-portable-prefix
          path: artifacts/pi-claude-portable-prefix.tar.gz
          if-no-files-found: error
          retention-days: 1
