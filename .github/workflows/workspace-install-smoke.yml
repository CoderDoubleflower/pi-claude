name: Workspace install smoke package

on:
  push:
    branches:
      - automation/workspace-install-20260731

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build release package
        run: npm run build:offline

      - name: Pack coding-agent package
        run: |
          mkdir -p artifacts
          cd packages/coding-agent
          npm pack --pack-destination ../../artifacts
          cd ../..
          ls -lah artifacts

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: pi-claude-npm-tarball
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1
