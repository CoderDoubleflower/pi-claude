name: Validate status line feature branch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  build-feature-branch:
    if: github.event.pull_request.head.ref == 'feat/claude-compatible-status-line'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/claude-compatible-status-line
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Apply refresh-loop fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          status_path = Path("packages/coding-agent/src/core/status-line.ts")
          status = status_path.read_text()
          old = '''\t\tconst signature = JSON.stringify([configSignature, request.columns, request.input]);
          \t\tthis.latestRequest = { settings, ...request, signature };
          '''
          new = '''\t\tconst signatureInput = {
          \t\t\t...request.input,
          \t\t\tcost: {
          \t\t\t\t...request.input.cost,
          \t\t\t\ttotal_duration_ms: 0,
          \t\t\t},
          \t\t};
          \t\tconst signature = JSON.stringify([configSignature, request.columns, signatureInput]);
          \t\tthis.latestRequest = { settings, ...request, signature };
          '''
          if old not in status:
              raise SystemExit("Expected status-line signature anchor was not found")
          status_path.write_text(status.replace(old, new, 1))

          test_path = Path("packages/coding-agent/test/status-line.test.ts")
          test = test_path.read_text()
          anchor = '''\t});
          });

          describe("footer status composition", () => {'''
          replacement = '''\t});

          \tit("does not re-run solely because elapsed duration changed", async () => {
          \t\tconst directory = mkdtempSync(join(tmpdir(), "pi-status-line-duration-"));
          \t\tconst scriptPath = join(directory, "statusline-duration.mjs");
          \t\twriteFileSync(
          \t\t\tscriptPath,
          \t\t\t`let input = "";
          process.stdin.setEncoding("utf8");
          process.stdin.on("data", chunk => input += chunk);
          process.stdin.on("end", () => {
            const value = JSON.parse(input);
            process.stdout.write(String(value.cost.total_duration_ms));
          });
          `,
          \t\t);
          \t\tchmodSync(scriptPath, 0o755);

          \t\tlet renderCount = 0;
          \t\tlet resolveFirstRender: (() => void) | undefined;
          \t\tconst firstRendered = new Promise<void>((resolve) => {
          \t\t\tresolveFirstRender = resolve;
          \t\t});
          \t\tconst runner = new StatusLineCommandRunner(() => {
          \t\t\trenderCount += 1;
          \t\t\tif (renderCount === 1) resolveFirstRender?.();
          \t\t});
          \t\tconst command = `${JSON.stringify(process.execPath)} ${JSON.stringify(scriptPath)}`;
          \t\tconst settings = { type: "command" as const, command };
          \t\tconst initialRequest = { input, cwd: process.cwd(), columns: 80 };

          \t\ttry {
          \t\t\trunner.update(settings, initialRequest);
          \t\t\tawait Promise.race([
          \t\t\t\tfirstRendered,
          \t\t\t\tnew Promise<never>((_, reject) => setTimeout(() => reject(new Error("status line timed out")), 3000)),
          \t\t\t]);

          \t\t\tconst updatedInput = {
          \t\t\t\t...input,
          \t\t\t\tcost: { ...input.cost, total_duration_ms: 1000 },
          \t\t\t};
          \t\t\tconst result = runner.update(settings, {
          \t\t\t\tinput: updatedInput,
          \t\t\t\tcwd: process.cwd(),
          \t\t\t\tcolumns: 80,
          \t\t\t});
          \t\t\tawait new Promise((resolve) => setTimeout(resolve, 600));

          \t\t\texpect(renderCount).toBe(1);
          \t\t\texpect(result.lines).toEqual(["0"]);
          \t\t} finally {
          \t\t\trunner.dispose();
          \t\t\trmSync(directory, { recursive: true, force: true });
          \t\t}
          \t});
          });

          describe("footer status composition", () => {'''
          if anchor not in test:
              raise SystemExit("Expected status-line test anchor was not found")
          test_path.write_text(test.replace(anchor, replacement, 1))
          PY

      - name: Format changed files
        run: >-
          npx biome check --write
          packages/coding-agent/src/core/status-line.ts
          packages/coding-agent/test/status-line.test.ts

      - name: Run focused tests
        working-directory: packages/coding-agent
        run: node ../../node_modules/vitest/dist/cli.js --run test/status-line.test.ts

      - name: Hydrate model data
        run: npm run hydrate:model-data

      - name: Build workspace
        run: npm run build:offline

      - name: Commit validated implementation
        shell: bash
        run: |
          rm .status-line-fix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src/core/status-line.ts \
            packages/coding-agent/test/status-line.test.ts \
            .status-line-fix-trigger
          git commit -m "fix(coding-agent): stabilize status line refreshes"
          git push origin HEAD:feat/claude-compatible-status-line
