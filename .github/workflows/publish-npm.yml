name: Publish pi-claude to npm

on:
  workflow_dispatch:
    inputs:
      retry_current:
        description: Publish the current package version without incrementing it (use after a failed publish)
        required: true
        default: false
        type: boolean
      bump:
        description: Version increment when retry_current is false and an exact version is not supplied
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Optional exact version in x.y.z form
        required: false
        type: string
  push:
    tags:
      - pi-claude-v*

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-pi-claude
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure trusted-publishing compatible npm
        run: npm install --global npm@latest

      - name: Prepare requested version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from the main branch." >&2
            exit 1
          fi

          if [[ '${{ inputs.retry_current }}' == 'true' ]]; then
            release_version="$(node -p "require('./packages/coding-agent/package.json').version")"
            echo "Retrying current package version: $release_version"
          else
            target='${{ inputs.version }}'
            if [[ -z "$target" ]]; then
              target='${{ inputs.bump }}'
            fi
            node scripts/prepare-pi-claude-release.mjs "$target"
            release_version="$(node -p "require('./packages/coding-agent/package.json').version")"
          fi

          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=pi-claude-v$release_version" >> "$GITHUB_ENV"

      - name: Resolve tagged version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#pi-claude-v}"
          package_version="$(node -p "require('./packages/coding-agent/package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag version $version does not match package version $package_version." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Refresh release metadata
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm install --package-lock-only --ignore-scripts
          node scripts/generate-coding-agent-shrinkwrap.mjs
          node scripts/generate-coding-agent-install-lock.mjs

      - name: Commit prepared release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet --exit-code; then
            git add -A
            git commit -m "Release pi-claude v${RELEASE_VERSION}"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No release metadata changes to commit."
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install test tool dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes fd-find ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          fd --version
          rg --version

      - name: Hydrate model data
        run: npm run hydrate:model-data

      - name: Build
        run: npm run build:offline

      - name: Test coding agent
        run: npm test --workspace=@doubleflower/pi-claude

      - name: Validate generated locks
        run: |
          npm run check:shrinkwrap
          npm run check:install-lock:coding-agent

      - name: Build exact release tarball
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/pi-claude-release"
          tarball="$(node scripts/build-pi-claude-release-tarball.mjs --output-dir "$output_dir")"
          echo "RELEASE_TARBALL=$tarball" >> "$GITHUB_ENV"
          npm pack --json --dry-run --ignore-scripts "$tarball"

      - name: Smoke-test exact release tarball
        run: bash scripts/smoke-packed-cli-startup.sh "$RELEASE_TARBALL"

      - name: Check npm registry state
        id: registry
        shell: bash
        run: |
          if npm view '@doubleflower/pi-claude' name --json >/dev/null 2>&1; then
            echo 'package_exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'package_exists=false' >> "$GITHUB_OUTPUT"
          fi

          if npm view "@doubleflower/pi-claude@${RELEASE_VERSION}" version --json >/dev/null 2>&1; then
            echo 'version_exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'version_exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish first package version with npm token
        if: steps.registry.outputs.package_exists == 'false' && steps.registry.outputs.version_exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo '::error::NPM_TOKEN is missing. The first publication requires a granular npm token with read/write access and Bypass 2FA enabled.'
            exit 1
          fi

          set +e
          output="$(npm publish "$RELEASE_TARBALL" --access public --provenance --ignore-scripts 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          if [[ $status -ne 0 ]]; then
            if grep -q 'EOTP\|one-time password' <<<"$output"; then
              echo '::error::NPM_TOKEN does not bypass 2FA. Create a granular npm token with read/write access and the “Bypass two-factor authentication” option enabled, then replace the NPM_TOKEN repository secret.'
            fi
            exit "$status"
          fi

      - name: Publish existing package with npm trusted publishing
        if: steps.registry.outputs.package_exists == 'true' && steps.registry.outputs.version_exists == 'false'
        run: npm publish "$RELEASE_TARBALL" --access public --ignore-scripts

      - name: Skip already published version
        if: steps.registry.outputs.version_exists == 'true'
        run: echo "@doubleflower/pi-claude@${RELEASE_VERSION} is already published; skipping npm publish."

      - name: Create or repair release tag
        shell: bash
        env:
          VERSION_WAS_ALREADY_PUBLISHED: ${{ steps.registry.outputs.version_exists }}
        run: |
          git fetch --tags --force
          current_sha="$(git rev-parse HEAD)"

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$VERSION_WAS_ALREADY_PUBLISHED" == 'false' && "$tag_sha" != "$current_sha" ]]; then
              echo "Moving failed-release tag $RELEASE_TAG from $tag_sha to $current_sha."
              git tag --force "$RELEASE_TAG" "$current_sha"
              git push --force origin "refs/tags/$RELEASE_TAG"
            else
              echo "$RELEASE_TAG already exists at $tag_sha."
            fi
          else
            git tag "$RELEASE_TAG" "$current_sha"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already has a GitHub release."
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "pi-claude v${RELEASE_VERSION}"
          fi
