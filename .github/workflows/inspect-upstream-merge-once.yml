name: Validated upstream sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.title == 'Trigger validated upstream sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Merge upstream and resolve reviewed conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/earendil-works/pi.git
          git fetch --no-tags upstream main
          git checkout -B automation/upstream-sync-2026-07-30-v2

          set +e
          git merge --no-commit --no-ff upstream/main
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            expected=(
              ".pi/extensions/prompt-url-widget.ts"
              "packages/coding-agent/CHANGELOG.md"
              "packages/coding-agent/README.md"
            )

            for conflict in "${conflicts[@]}"; do
              allowed=false
              for expected_path in "${expected[@]}"; do
                if [[ "$conflict" == "$expected_path" ]]; then
                  allowed=true
                  break
                fi
              done
              if [[ "$allowed" != true ]]; then
                echo "Unexpected merge conflict: $conflict" >&2
                exit 1
              fi
            done

            if [[ ${#conflicts[@]} -ne ${#expected[@]} ]]; then
              echo "Expected exactly ${#expected[@]} reviewed conflicts, got ${#conflicts[@]}" >&2
              printf '%s\n' "${conflicts[@]}" >&2
              exit 1
            fi

            git checkout --ours -- \
              .pi/extensions/prompt-url-widget.ts \
              packages/coding-agent/CHANGELOG.md \
              packages/coding-agent/README.md
          fi

          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(text, before, after, label) {
            const index = text.indexOf(before);
            if (index < 0) throw new Error(`Missing ${label}`);
            if (text.indexOf(before, index + before.length) >= 0) throw new Error(`Multiple matches for ${label}`);
            return `${text.slice(0, index)}${after}${text.slice(index + before.length)}`;
          }

          const widgetPath = '.pi/extensions/prompt-url-widget.ts';
          let widget = fs.readFileSync(widgetPath, 'utf8');
          if (!widget.includes('import { Container, hyperlink, Text } from "@earendil-works/pi-tui";')) {
            widget = replaceOnce(
              widget,
              'import { Container, Text } from "@earendil-works/pi-tui";',
              'import { Container, hyperlink, Text } from "@earendil-works/pi-tui";',
              'prompt widget TUI import',
            );
          }
          if (!widget.includes(': hyperlink(thm.fg("accent", displayTarget), displayTarget);')) {
            widget = replaceOnce(
              widget,
              ': thm.fg("accent", displayTarget);',
              ': hyperlink(thm.fg("accent", displayTarget), displayTarget);',
              'prompt widget title hyperlink',
            );
          }
          if (!widget.includes('const urlLine = hyperlink(thm.fg("dim", displayTarget), displayTarget);')) {
            widget = replaceOnce(
              widget,
              'const urlLine = thm.fg("dim", displayTarget);',
              'const urlLine = hyperlink(thm.fg("dim", displayTarget), displayTarget);',
              'prompt widget URL hyperlink',
            );
          }
          fs.writeFileSync(widgetPath, widget);

          function addUnreleasedBullet(markdown, heading, bullet) {
            if (markdown.includes(bullet)) return markdown;
            const unreleasedStart = markdown.indexOf('## [Unreleased]');
            const nextRelease = markdown.indexOf('\n## [', unreleasedStart + 1);
            if (unreleasedStart < 0 || nextRelease < 0) throw new Error('Unable to locate Unreleased changelog section');

            const prefix = markdown.slice(0, unreleasedStart);
            let section = markdown.slice(unreleasedStart, nextRelease);
            const suffix = markdown.slice(nextRelease);
            const headingText = `### ${heading}`;
            const headingIndex = section.indexOf(headingText);

            if (headingIndex < 0) {
              section = `${section.trimEnd()}\n\n${headingText}\n\n${bullet}\n`;
            } else {
              const contentStart = headingIndex + headingText.length;
              const nextHeading = section.indexOf('\n### ', contentStart);
              const insertAt = nextHeading < 0 ? section.length : nextHeading;
              section = `${section.slice(0, insertAt).trimEnd()}\n${bullet}\n\n${section.slice(insertAt).replace(/^\n+/, '')}`;
            }
            return `${prefix}${section}${suffix}`;
          }

          const changelogPath = 'packages/coding-agent/CHANGELOG.md';
          let changelog = fs.readFileSync(changelogPath, 'utf8');
          changelog = addUnreleasedBullet(
            changelog,
            'Added',
            '- Added `--alt` to run interactive mode with the alternate-screen TUI ([#7304](https://github.com/earendil-works/pi/issues/7304)).',
          );
          changelog = addUnreleasedBullet(
            changelog,
            'Fixed',
            '- Fixed `setToolsExpanded(false)` to be a no-op when tool output is already collapsed, avoiding redundant `Tool output: collapsed` startup notices from extensions ([#7292](https://github.com/earendil-works/pi/issues/7292)).',
          );
          fs.writeFileSync(changelogPath, changelog);

          const readmePath = 'packages/coding-agent/README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          const altBullet = '- Optional alternate-screen TUI with application-owned scrolling via `pi-claude --alt`';
          if (!readme.includes(altBullet)) {
            readme = replaceOnce(
              readme,
              '- Streaming interactive terminal UI\n',
              `- Streaming interactive terminal UI\n${altBullet}\n`,
              'README core capability insertion point',
            );
          }
          fs.writeFileSync(readmePath, readme);
          NODE

          git add \
            .pi/extensions/prompt-url-widget.ts \
            packages/coding-agent/CHANGELOG.md \
            packages/coding-agent/README.md

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git commit -m "Merge latest upstream earendil-works/pi main"

      - name: Preserve fork identity and regenerate lock files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const readJson = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const writeJson = (path, value) => fs.writeFileSync(path, `${JSON.stringify(value, null, '\t')}\n`);
          const firstParentJson = (path) => JSON.parse(execFileSync('git', ['show', `HEAD^1:${path}`], { encoding: 'utf8' }));

          const codingPath = 'packages/coding-agent/package.json';
          const forkCoding = firstParentJson(codingPath);
          const coding = readJson(codingPath);
          for (const key of ['name', 'description', 'piConfig', 'bin', 'keywords', 'author', 'contributors', 'repository', 'bugs', 'homepage', 'publishConfig']) {
            if (Object.prototype.hasOwnProperty.call(forkCoding, key)) coding[key] = forkCoding[key];
          }
          writeJson(codingPath, coding);

          const packageName = coding.name;
          const packageVersion = coding.version;
          for (const path of ['packages/evals/package.json', 'packages/server/package.json']) {
            const pkg = readJson(path);
            for (const section of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
              if (!pkg[section]) continue;
              if (Object.prototype.hasOwnProperty.call(pkg[section], '@earendil-works/pi-coding-agent')) {
                delete pkg[section]['@earendil-works/pi-coding-agent'];
                pkg[section][packageName] = `^${packageVersion}`;
              }
            }
            writeJson(path, pkg);
          }
          NODE

          npm install --package-lock-only --ignore-scripts
          node scripts/generate-coding-agent-shrinkwrap.mjs
          node scripts/generate-coding-agent-install-lock.mjs

          git add package-lock.json packages/coding-agent/package.json packages/coding-agent/npm-shrinkwrap.json packages/coding-agent/install-lock/package.json packages/coding-agent/install-lock/package-lock.json packages/evals/package.json packages/server/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: reconcile pi-claude metadata after upstream merge"
          fi

      - name: Verify preserved and inherited features
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'alt?: boolean;' packages/coding-agent/src/cli/args.ts
          grep -Fq 'arg === "--alt"' packages/coding-agent/src/cli/args.ts
          grep -Fq 'TuiAltScreen' packages/coding-agent/src/modes/interactive/interactive-mode.ts
          grep -Fq 'createInteractiveTui' packages/coding-agent/src/modes/interactive/interactive-mode.ts
          grep -Fq 'if (expanded === this.toolOutputExpanded) return;' packages/coding-agent/src/modes/interactive/interactive-mode.ts
          grep -Fq '@doubleflower/pi-claude' .pi/extensions/prompt-url-widget.ts
          grep -Fq 'hyperlink(thm.fg("dim", displayTarget), displayTarget)' .pi/extensions/prompt-url-widget.ts
          test -f packages/coding-agent/src/core/tools/todo-write.ts
          grep -Fq '"TodoWrite"' packages/coding-agent/src/core/tools/index.ts
          test -f packages/tui/src/TuiAltScreen.ts
          test -f packages/tui/src/TuiMainScreen.ts
          grep -Fq 'OpenCode Go' packages/ai/src/providers/opencode-go.ts

      - name: Install dependencies and test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          npm ci

      - name: Check and build
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: apply post-merge generated updates"
          fi
          npm run build

      - name: Run focused regression suites
        shell: bash
        run: |
          set -euo pipefail
          npm test --workspace=@earendil-works/pi-tui
          npm test --workspace=@doubleflower/pi-claude
          npm test --workspace=@earendil-works/pi-evals --if-present

      - name: Push validated integration branch
        run: git push --force-with-lease origin HEAD:refs/heads/automation/upstream-sync-2026-07-30-v2
