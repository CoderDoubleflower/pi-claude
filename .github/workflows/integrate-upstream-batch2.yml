name: Integrate upstream batch 2

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: integrate-upstream-batch2
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'sync/upstream-batch2-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-batch2-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Cherry-pick reviewed upstream batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          marker=.github/upstream-batch2-conflict.txt
          if [ -f "$marker" ]; then
            echo "A recorded conflict requires semantic resolution:"
            cat "$marker"
            exit 0
          fi

          git remote add upstream https://github.com/earendil-works/pi.git 2>/dev/null || true
          git fetch upstream main --no-tags

          sync_base=4c01c709380621c5ff2719162cd7a7973dcb2799
          selected="
          35fe55573cc1f49377ca2c63b369a559e4c699ce
          4f4762f06de104d7f108bb6cfa387259dc825c84
          e56893f4cd6545ab1498b72ae4e1e2241a0926f4
          32850ef7c5edff7a6eee0214516fbb7382bf292d
          a4475344fb765850ec5321efe3c67e6f364ead5c
          "

          mapfile -t ordered < <(git rev-list --reverse "${sync_base}..upstream/main")
          integrated=0
          for sha in "${ordered[@]}"; do
            if ! grep -qxF "$sha" <<<"$(printf '%s\n' $selected)"; then
              continue
            fi
            if git log --format=%B | grep -qF "Upstream-Commit: $sha"; then
              echo "Already integrated: $sha"
              continue
            fi

            echo "Cherry-picking $sha"
            parent_fields=$(git rev-list --parents -n 1 "$sha" | awk '{print NF}')
            set +e
            if [ "$parent_fields" -gt 2 ]; then
              git cherry-pick -m 1 "$sha"
            else
              git cherry-pick "$sha"
            fi
            rc=$?
            set -e

            if [ "$rc" -ne 0 ]; then
              echo "Conflict while applying $sha"
              conflict_files=$(git diff --name-only --diff-filter=U)
              for file in $conflict_files; do
                echo "===== CONFLICT: $file ====="
                git diff --cc -- "$file" || true
              done
              git cherry-pick --abort
              {
                echo "failed_commit=$sha"
                echo "conflicted_files:"
                printf '%s\n' "$conflict_files"
              } > "$marker"
              git add "$marker"
              git commit -m "chore: record upstream batch 2 conflict"
              git push origin HEAD:sync/upstream-batch2-20260805
              exit 1
            fi

            original_message=$(git log -1 --pretty=%B)
            git commit --amend -m "${original_message%$'\n'}" -m "Upstream-Commit: $sha"
            integrated=1
          done

          if [ "$integrated" -eq 1 ]; then
            git push origin HEAD:sync/upstream-batch2-20260805
          else
            echo "No new upstream commits required."
          fi
