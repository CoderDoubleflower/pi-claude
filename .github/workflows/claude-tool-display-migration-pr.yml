name: Claude tool display migration verifier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  migrate-and-verify:
    if: github.head_ref == 'feat/claude-tool-display-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect pending migration
        id: migration
        run: |
          if [ -f scripts/apply-claude-tool-display-parity.py ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Validated implementation is already materialized on the PR branch."
          fi

      - name: Set up Node
        if: steps.migration.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Apply migration
        if: steps.migration.outputs.needed == 'true'
        run: |
          python3 scripts/apply-claude-tool-display-parity.py
          python3 scripts/fix-claude-tool-display-generated.py
          python3 scripts/repair-claude-tool-display-source.py
          python3 scripts/repair-claude-tool-display-types.py

      - name: Install dependencies
        if: steps.migration.outputs.needed == 'true'
        run: npm ci --ignore-scripts

      - name: Migrate generated Bash preview tests
        if: steps.migration.outputs.needed == 'true'
        run: python3 scripts/repair-claude-bash-preview-tests.py

      - name: Format changed files
        if: steps.migration.outputs.needed == 'true'
        run: |
          npx biome check --write \
            packages/coding-agent/src/core/tools/index.ts \
            packages/coding-agent/src/core/tools/bash.ts \
            packages/coding-agent/src/core/tools/read.ts \
            packages/coding-agent/src/core/tools/grep.ts \
            packages/coding-agent/src/core/tools/find.ts \
            packages/coding-agent/src/core/tools/ls.ts \
            packages/coding-agent/src/modes/interactive/components/tool-activity-group.ts \
            packages/coding-agent/src/modes/interactive/interactive-mode.ts \
            packages/coding-agent/test/bash-command-rendering.test.ts \
            packages/coding-agent/test/claude-tool-display.test.ts

      - name: TypeScript check
        if: steps.migration.outputs.needed == 'true'
        shell: bash
        run: |
          set +e
          npx tsgo --noEmit > /tmp/tsgo.log 2>&1
          status=$?
          tail -n 120 /tmp/tsgo.log
          exit $status

      - name: Import check
        if: steps.migration.outputs.needed == 'true'
        run: npm run check:ts-imports

      - name: Run focused display tests
        if: steps.migration.outputs.needed == 'true'
        run: npm exec --workspace=@doubleflower/pi-claude vitest --run test/bash-command-rendering.test.ts test/claude-tool-display.test.ts

      - name: Run coding-agent tests
        if: steps.migration.outputs.needed == 'true'
        run: npm test --workspace=@doubleflower/pi-claude

      - name: Build repository
        if: steps.migration.outputs.needed == 'true'
        run: npm run build

      - name: Remove one-off migration files
        if: steps.migration.outputs.needed == 'true'
        run: rm -f scripts/apply-claude-tool-display-parity.py scripts/fix-claude-tool-display-generated.py scripts/repair-claude-tool-display-source.py scripts/repair-claude-tool-display-types.py scripts/repair-claude-bash-preview-tests.py .github/workflows/apply-claude-tool-display-parity.yml .github/claude-tool-display-rerun

      - name: Commit implementation
        if: steps.migration.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(coding-agent): match Claude Code tool display strategy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
