name: Prepare npm package metadata

on:
  push:
    branches:
      - chore/npm-package-identity

permissions:
  contents: write

jobs:
  update-lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org

      - name: Refresh root lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Regenerate coding-agent shrinkwrap
        run: node scripts/generate-coding-agent-shrinkwrap.mjs

      - name: Commit generated metadata and remove workflow
        run: |
          rm .github/workflows/prepare-npm-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json packages/coding-agent/npm-shrinkwrap.json .github/workflows/prepare-npm-package.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(coding-agent): sync npm lock metadata"
            git push
          fi
