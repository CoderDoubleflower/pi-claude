name: Finalize upstream batch 1 clean branch

on:
  push:
    branches:
      - main
    paths:
      - .github/upstream-batch1-clean-trigger

permissions:
  contents: write

concurrency:
  group: finalize-upstream-batch1-clean
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-batch1-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Remove temporary integration artifacts
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/batch1-ci-trigger.txt \
            .github/scripts/upstream-batch1-model-tests.sh \
            .github/workflows/apply-upstream-batch1-final-files.yml \
            .github/workflows/export-upstream-batch1-final-files.yml \
            .github/workflows/upstream-sync-batch1-model-tests.yml

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format reconciled files
        shell: bash
        run: |
          set -euo pipefail
          npx biome check --write \
            packages/agent/src/agent.ts \
            packages/coding-agent/src/core/remote-compaction/extension.ts

      - name: Build workspace
        run: npm run build

      - name: Run repository checks
        run: npm run check

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          npx vitest --run \
            packages/agent/test/agent.test.ts \
            packages/ai/test/google-shared-gemini3-unsigned-tool-call.test.ts \
            packages/ai/test/google-shared-retry.test.ts \
            packages/ai/test/sampling-options.test.ts \
            packages/ai/test/validation.test.ts \
            packages/coding-agent/test/model-resolver.test.ts \
            packages/coding-agent/test/package-manager.test.ts \
            packages/coding-agent/test/suite/agent-session-tool-result-images.test.ts \
            packages/coding-agent/test/suite/regressions/6104-find-root-relativization.test.ts \
            packages/coding-agent/test/suite/regressions/7150-rpc-prompt-during-compaction.test.ts \
            packages/coding-agent/test/suite/regressions/7497-session-discovery-symlink.test.ts \
            packages/tui/test/terminal-colors.test.ts \
            packages/tui/test/terminal.test.ts

      - name: Commit clean validated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Model generation is intentionally not part of this upstream batch.
          git checkout origin/main -- packages/ai/src/models.generated.ts packages/ai/src/providers/data 2>/dev/null || true

          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
          else
            git commit -m "chore: finalize reviewed upstream fixes batch 1"
            git push origin HEAD:sync/upstream-batch1-20260805
          fi
