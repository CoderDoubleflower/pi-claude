name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build exact release tarball
        id: release-package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          output_dir="$RUNNER_TEMP/pi-claude-release"
          tarball_path_file="$(mktemp)"

          set +e
          node scripts/build-pi-claude-release-tarball.mjs --output-dir "$output_dir" \
            >"$tarball_path_file" \
            2> >(tee .artifacts/build-release-tarball.log >&2)
          status=$?
          set -e

          if [[ $status -ne 0 ]]; then
            echo "::error::Release tarball build failed with status $status."
            exit "$status"
          fi

          tarball="$(tail -n 1 "$tarball_path_file")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Smoke-test exact release tarball
        run: bash scripts/smoke-packed-cli-startup.sh "${{ steps.release-package.outputs.tarball }}"

      - name: Upload packed runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pi-claude-release-runtime-diagnostics
          path: |
            .artifacts/build-release-tarball.log
            .artifacts/smoke-packed-cli.log
            .artifacts/release-runtime-diff.json
          if-no-files-found: ignore
          retention-days: 1
