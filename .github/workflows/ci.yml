name: Verify published package

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-registry-release:
    if: github.head_ref == 'automation/publish-v0.83.13-final-20260805'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm latest
        run: npm install --global npm@latest

      - name: Install and start registry package
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/pi-claude-registry-prefix"
          smoke_home="$RUNNER_TEMP/pi-claude-registry-home"
          mkdir -p "$prefix" "$smoke_home"

          registry_version="$(npm view @doubleflower/pi-claude@0.83.13 version)"
          [[ "$registry_version" == '0.83.13' ]]

          npm install --global --ignore-scripts --prefix "$prefix" @doubleflower/pi-claude@0.83.13
          cli="$prefix/bin/pi-claude"

          installed_version="$("$cli" --version)"
          echo "installed_version=$installed_version"
          [[ "$installed_version" == '0.83.13' ]]

          set +e
          startup_output="$(
            timeout --signal=INT --kill-after=5s 4s \
              script --quiet --return --command \
                "env HOME='$smoke_home' TERM=xterm-256color PI_OFFLINE=1 '$cli'" \
                /dev/null 2>&1
          )"
          startup_status=$?
          set -e

          printf '%s\n' "$startup_output"
          echo "startup_status=$startup_status"

          if grep -Eiq \
            'uncaughtException|does not provide an export|ERR_MODULE_NOT_FOUND|Cannot find package|is not a function|TypeError:|ReferenceError:|SyntaxError:' \
            <<<"$startup_output"; then
            echo '::error::The registry-installed CLI crashed during interactive startup.'
            exit 1
          fi

          if [[ $startup_status -ne 0 && $startup_status -ne 124 && $startup_status -ne 130 && $startup_status -ne 143 ]]; then
            echo "::error::The registry-installed CLI exited unexpectedly with status $startup_status."
            exit "$startup_status"
          fi

          echo 'registry_package_verification=success'
