name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout exact merged source for local verification
        if: github.head_ref == 'verify/local-container-20260805'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 23e5781984080c96982b3baae412db86da0098d1
          path: _local_verification_source
          fetch-depth: 1

      - name: Package exact merged source
        if: github.head_ref == 'verify/local-container-20260805'
        shell: bash
        run: tar -C _local_verification_source --exclude=.git -czf /tmp/pi-claude-source-23e5781.tar.gz .

      - name: Upload exact merged source
        if: github.head_ref == 'verify/local-container-20260805'
        uses: actions/upload-artifact@v4
        with:
          name: pi-claude-source-23e5781
          path: /tmp/pi-claude-source-23e5781.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Package dependencies and Node runtime for local verification
        if: github.head_ref == 'verify/local-container-20260805'
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name node_modules -prune -print0 > /tmp/node-modules-paths.txt
          tar --null -T /tmp/node-modules-paths.txt -czf /tmp/pi-claude-node-modules.tar.gz
          node_bin=$(readlink -f "$(command -v node)")
          node_root=$(dirname "$(dirname "$node_bin")")
          tar -C "$node_root" -czf /tmp/pi-node22-runtime.tar.gz .
          "$node_bin" --version > /tmp/pi-node22-version.txt
          npm --version >> /tmp/pi-node22-version.txt

      - name: Upload dependencies and Node runtime
        if: github.head_ref == 'verify/local-container-20260805'
        uses: actions/upload-artifact@v4
        with:
          name: pi-claude-local-deps-node22
          path: |
            /tmp/pi-claude-node-modules.tar.gz
            /tmp/pi-node22-runtime.tar.gz
            /tmp/pi-node22-version.txt
          retention-days: 1
          if-no-files-found: error

      - name: Build
        run: npm run build

      - name: Package generated model data and system tools
        if: github.head_ref == 'verify/local-container-20260805'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/pi-claude-generated-model-data.tar.gz \
            packages/ai/src/models.generated.ts \
            packages/ai/src/providers/data
          mkdir -p /tmp/pi-local-tools
          cp "$(command -v fdfind)" /tmp/pi-local-tools/fd
          cp "$(command -v rg)" /tmp/pi-local-tools/rg
          chmod +x /tmp/pi-local-tools/fd /tmp/pi-local-tools/rg
          tar -C /tmp/pi-local-tools -czf /tmp/pi-local-tools.tar.gz .

      - name: Upload generated model data and system tools
        if: github.head_ref == 'verify/local-container-20260805'
        uses: actions/upload-artifact@v4
        with:
          name: pi-claude-generated-data-tools
          path: |
            /tmp/pi-claude-generated-model-data.tar.gz
            /tmp/pi-local-tools.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Check
        run: npm run check

      - name: Test
        run: npm test
