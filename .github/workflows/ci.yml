name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

  integrate-markdown-transformer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/markdown-transformer-api'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/markdown-transformer-api
          fetch-depth: 0

      - name: Detect pending integration
        id: gate
        shell: bash
        run: |
          if [ -f .github/workflows/one-off-integrate-markdown-transformer.yml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply and validate isolated upstream feature
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/integrate-markdown-transformer.sh
          from pathlib import Path

          lines = Path('.github/workflows/one-off-integrate-markdown-transformer.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line == '        run: |') + 1
          for line in lines[start:]:
              if line.startswith('          '):
                  print(line[10:])
              elif line.strip():
                  raise SystemExit(f'Unexpected workflow content after run block: {line!r}')
              else:
                  print()
          PY

          cat > /tmp/adapt-markdown-tests.sh <<'ADAPT'
          sed -i "s/availableWidth: 78/availableWidth: 77/g" packages/coding-agent/test/assistant-message.test.ts
          sed -i "s/answer (78)/answer (77)/g" packages/coding-agent/test/assistant-message.test.ts
          sed -i "s/answer (58)/answer (57)/g" packages/coding-agent/test/assistant-message.test.ts
          sed -i "s/\[78, 58\]/[77, 57]/g" packages/coding-agent/test/assistant-message.test.ts
          sed -i "s/availableWidth: 78/availableWidth: 77/g" packages/coding-agent/test/user-message.test.ts
          ADAPT

          awk '
            BEGIN {
              while ((getline line < "/tmp/adapt-markdown-tests.sh") > 0) {
                adaptation = adaptation line ORS
              }
            }
            /^unresolved=/ { printf "%s", adaptation }
            { print }
          ' /tmp/integrate-markdown-transformer.sh > /tmp/integrate-markdown-transformer.next.sh
          mv /tmp/integrate-markdown-transformer.next.sh /tmp/integrate-markdown-transformer.sh

          sed -i '/packages\/tui\/test\/markdown.test.ts/d' /tmp/integrate-markdown-transformer.sh
          sed -i 's#packages/coding-agent/test/extensions-discovery.test.ts \\#packages/coding-agent/test/extensions-discovery.test.ts#' /tmp/integrate-markdown-transformer.sh
          sed -i '/^npm run check:package-smoke/i npm test --workspace=@earendil-works/pi-tui' /tmp/integrate-markdown-transformer.sh

          rm -f .github/markdown-transformer-retry
          chmod +x /tmp/integrate-markdown-transformer.sh
          bash /tmp/integrate-markdown-transformer.sh
