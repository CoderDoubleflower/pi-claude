name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Apply fullscreen-only source patch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/fullscreen-only-ui'
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-fullscreen-only.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/apply-fullscreen-only.py').write_text(script)
          PY
          python /tmp/apply-fullscreen-only.py

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Commit fullscreen-only implementation
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/fullscreen-only-ui'
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/workflows/apply-fullscreen-only.yml
          rm .github/workflows/apply-fullscreen-only-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(coding-agent): lock UI to fullscreen [fullscreen-only applied]"
          git push origin HEAD:${{ github.head_ref }}
