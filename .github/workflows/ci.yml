name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build exact release tarball
        id: release-package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          output_dir="$RUNNER_TEMP/pi-claude-release"
          tarball_path_file="$(mktemp)"

          set +e
          node scripts/build-pi-claude-release-tarball.mjs --output-dir "$output_dir" \
            >"$tarball_path_file" \
            2> >(tee .artifacts/build-release-tarball.log >&2)
          status=$?
          set -e

          if [[ $status -ne 0 ]]; then
            echo "::error::Release tarball build failed with status $status."
            exit "$status"
          fi

          tarball="$(tail -n 1 "$tarball_path_file")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Smoke-test exact release tarball
        run: bash scripts/smoke-packed-cli-startup.sh "${{ steps.release-package.outputs.tarball }}"

      - name: Upload packed runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pi-claude-release-runtime-diagnostics
          path: |
            .artifacts/build-release-tarball.log
            .artifacts/smoke-packed-cli.log
            .artifacts/release-runtime-diff.json
          if-no-files-found: ignore
          retention-days: 1

  publish-current-once:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore: run and capture pi-claude v0.83.13 publish'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch, wait, and record publish result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CREATED_AFTER: '2026-08-05T13:23:00Z'
        run: |
          set -euo pipefail

          find_latest_run() {
            gh api "/repos/${REPOSITORY}/actions/workflows/publish-npm.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              --jq ".workflow_runs | map(select(.created_at > \"${CREATED_AFTER}\")) | sort_by(.created_at) | last | .id // empty"
          }

          run_id="$(find_latest_run)"
          if [[ -z "$run_id" ]]; then
            gh api --method POST "/repos/${REPOSITORY}/actions/workflows/publish-npm.yml/dispatches" \
              --raw-field ref=main \
              --field 'inputs[retry_current]=true' \
              --field 'inputs[bump]=patch' \
              --field 'inputs[version]='

            for _ in $(seq 1 60); do
              sleep 5
              run_id="$(find_latest_run)"
              [[ -n "$run_id" ]] && break
            done
          fi

          if [[ -z "$run_id" ]]; then
            echo 'Could not find or create the publish workflow run.' >&2
            exit 1
          fi

          for _ in $(seq 1 360); do
            status="$(gh api "/repos/${REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
            [[ "$status" == 'completed' ]] && break
            sleep 5
          done

          run_json="$(gh api "/repos/${REPOSITORY}/actions/runs/${run_id}")"
          jobs_json="$(gh api "/repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          conclusion="$(jq -r '.conclusion // .status' <<<"$run_json")"

          failed_log=''
          if [[ "$conclusion" != 'success' ]]; then
            set +e
            failed_log="$(gh run view "$run_id" --repo "$REPOSITORY" --log-failed 2>&1)"
            set -e
            failed_log="$(printf '%s' "$failed_log" | tail -c 50000)"
          fi

          report="$(
            jq -n \
              --arg generated_at "$(date -u +%FT%TZ)" \
              --arg failed_log "$failed_log" \
              --argjson run "$run_json" \
              --argjson jobs "$jobs_json" \
              '{generated_at: $generated_at, run: {id: $run.id, html_url: $run.html_url, status: $run.status, conclusion: $run.conclusion, event: $run.event, head_branch: $run.head_branch, head_sha: $run.head_sha, created_at: $run.created_at, updated_at: $run.updated_at}, jobs: [$jobs.jobs[] | {id, name, status, conclusion, html_url, steps: [.steps[] | {name, status, conclusion, number}]}], failed_log: $failed_log}'
          )"

          encoded="$(printf '%s\n' "$report" | base64 -w0)"
          report_path='.github/publish-run-report.json'
          existing_sha="$(gh api "/repos/${REPOSITORY}/contents/${report_path}?ref=main" --jq '.sha' 2>/dev/null || true)"

          args=(--method PUT "/repos/${REPOSITORY}/contents/${report_path}" --raw-field message='chore: record pi-claude v0.83.13 publish result' --raw-field content="$encoded" --raw-field branch=main)
          if [[ -n "$existing_sha" ]]; then
            args+=(--raw-field sha="$existing_sha")
          fi
          gh api "${args[@]}"
