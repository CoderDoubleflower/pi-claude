name: Finalize plan clear-context integration

on:
  pull_request_target:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  statuses: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/plan-clear-context-session'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/plan-clear-context-session
          fetch-depth: 0

      - name: Apply final integration patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              path.write_text(text.replace(old, new, 1))

          types = Path('packages/coding-agent/src/core/extensions/types.ts')
          text = types.read_text()
          if '\tgetActiveTools(): string[];' not in text:
              replace_once(
                  types,
                  '''\tsendUserMessage(
\t\tcontent: string | (TextContent | ImageContent)[],
\t\toptions?: { deliverAs?: "steer" | "followUp" },
\t): Promise<void>;
}
''',
                  '''\tsendUserMessage(
\t\tcontent: string | (TextContent | ImageContent)[],
\t\toptions?: { deliverAs?: "steer" | "followUp" },
\t): Promise<void>;

\t/** Read the active tool set in the replacement session. */
\tgetActiveTools(): string[];
\t/** Replace the active tool set in the replacement session. */
\tsetActiveTools(toolNames: string[]): void;
\t/** Select the model for the replacement session when available. */
\tsetModel(model: Model<any>): Promise<boolean>;
\t/** Select the thinking level for the replacement session. */
\tsetThinkingLevel(level: ThinkingLevel): void;
}
''',
              )

          session = Path('packages/coding-agent/src/core/agent-session.ts')
          text = session.read_text()
          if 'context.setActiveTools = ' not in text:
              replace_once(
                  session,
                  '''\t\tcontext.sendMessage = (message, options) => this.sendCustomMessage(message, options);
\t\tcontext.sendUserMessage = (content, options) => this.sendUserMessage(content, options);
\t\treturn context;
''',
                  '''\t\tcontext.sendMessage = (message, options) => this.sendCustomMessage(message, options);
\t\tcontext.sendUserMessage = (content, options) => this.sendUserMessage(content, options);
\t\tcontext.getActiveTools = () => this.getActiveToolNames();
\t\tcontext.setActiveTools = (toolNames) => this.setActiveToolsByName(toolNames);
\t\tcontext.setModel = async (model) => {
\t\t\tif (!this._modelRuntime.hasConfiguredAuth(model.provider)) return false;
\t\t\tawait this.setModel(model);
\t\t\treturn true;
\t\t};
\t\tcontext.setThinkingLevel = (level) => this.setThinkingLevel(level);
\t\treturn context;
''',
              )

          plan = Path('packages/coding-agent/src/extensions/plan-mode/index.ts')
          text = plan.read_text()
          if '\t\tconst model = ctx.model;' not in text:
              text = text.replace(
                  '''\t\tconst pending = state.pendingExecution;
\t\tconst savedTools = state.toolsBeforePlan;
\t\tconst parentSession = ctx.sessionManager.getSessionFile();
''',
                  '''\t\tconst pending = state.pendingExecution;
\t\tconst savedTools = state.toolsBeforePlan;
\t\tconst model = ctx.model;
\t\tconst thinkingLevel = ctx.thinkingLevel;
\t\tconst parentSession = ctx.sessionManager.getSessionFile();
''',
                  1,
              )
          if 'nextCtx.setActiveTools(savedTools)' not in text:
              text = text.replace(
                  '''\t\t\t\t\twithSession: async (nextCtx) => {
\t\t\t\t\t\tdeliveredInFreshSession = true;
''',
                  '''\t\t\t\t\twithSession: async (nextCtx) => {
\t\t\t\t\t\tif (model) await nextCtx.setModel(model);
\t\t\t\t\t\tif (thinkingLevel) nextCtx.setThinkingLevel(thinkingLevel);
\t\t\t\t\t\tif (savedTools) nextCtx.setActiveTools(savedTools);
\t\t\t\t\t\tdeliveredInFreshSession = true;
''',
                  1,
              )
          text = text.replace(
              'buildApprovedExecutionPrompt(pending.planPath, pending.plan),',
              'buildApprovedExecutionPrompt(pending.planPath, pending.plan, parentSession ?? undefined),',
              1,
          )
          plan.write_text(text)

          prompts = Path('packages/coding-agent/src/extensions/plan-mode/prompts.ts')
          text = prompts.read_text()
          old = '''export function buildApprovedExecutionPrompt(planPath: string, plan: string): string {
\treturn `The user approved the following implementation plan. Plan mode is over and normal tools are restored. Begin implementation now, keep the todo list current when useful, and verify the result end-to-end.\\n\\nPlan file: ${planPath}\\n\\n## Approved Plan\\n${plan}`;
}
'''
          new = '''export function buildApprovedExecutionPrompt(
\tplanPath: string,
\tplan: string,
\ttranscriptPath?: string,
): string {
\tconst transcriptHint = transcriptPath
\t\t? `\\n\\nIf you need exact details from planning, such as code snippets, error messages, or generated content, read the previous session transcript at: ${transcriptPath}`
\t\t: "";
\treturn `The user approved the following implementation plan. Plan mode is over and normal tools are restored. Begin implementation now, keep the todo list current when useful, and verify the result end-to-end.\\n\\nPlan file: ${planPath}\\n\\n## Approved Plan\\n${plan}${transcriptHint}`;
}
'''
          if 'transcriptPath?: string' not in text:
              if old not in text:
                  raise SystemExit('Could not locate buildApprovedExecutionPrompt')
              prompts.write_text(text.replace(old, new, 1))

          test = Path('packages/coding-agent/test/plan-mode.test.ts')
          text = test.read_text()
          if 'buildApprovedExecutionPrompt,' not in text:
              text = text.replace(
                  '''import {
\tbuildFullPlanModePrompt,
''',
                  '''import {
\tbuildApprovedExecutionPrompt,
\tbuildFullPlanModePrompt,
''',
                  1,
              )
          if 'nextCtx.setModel(model)' not in text:
              text = text.replace(
                  '''\t\texpect(source).toContain("Starting implementation with a clean context.");
''',
                  '''\t\texpect(source).toContain("Starting implementation with a clean context.");
\t\texpect(source).toContain("nextCtx.setModel(model)");
\t\texpect(source).toContain("nextCtx.setThinkingLevel(thinkingLevel)");
\t\texpect(source).toContain("nextCtx.setActiveTools(savedTools)");
''',
                  1,
              )
          if 'includes the previous transcript path' not in text:
              insertion = '''

\tit("includes the previous transcript path in clean-context execution prompts", () => {
\t\tconst prompt = buildApprovedExecutionPrompt(
\t\t\t"/tmp/example-plan.md",
\t\t\t"# Plan\\n\\n- Implement the change",
\t\t\t"/tmp/planning-session.jsonl",
\t\t);
\t\texpect(prompt).toContain("/tmp/example-plan.md");
\t\texpect(prompt).toContain("/tmp/planning-session.jsonl");
\t\texpect(prompt).toContain("exact details from planning");
\t});'''
              close = '\n});\n'
              index = text.rfind(close)
              if index < 0:
                  raise SystemExit('Could not find plan-mode suite closing marker')
              text = text[:index] + insertion + text[index:]
          test.write_text(text)
          PY

          for marker in \
            .github/trigger-plan-clear-context-state-pr \
            .github/trigger-plan-clear-context-final-pr; do
            if [ -f "$marker" ]; then git rm "$marker"; fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed files
        run: npx biome check --write --error-on-warnings packages/coding-agent/src/core/extensions/types.ts packages/coding-agent/src/core/agent-session.ts packages/coding-agent/src/extensions/plan-mode/index.ts packages/coding-agent/src/extensions/plan-mode/prompts.ts packages/coding-agent/test/plan-mode.test.ts

      - name: Build
        run: npm run build

      - name: Run focused plan-mode tests
        run: npx vitest --run packages/coding-agent/test/plan-mode.test.ts packages/coding-agent/test/plan-mode-shortcut.test.ts

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A packages/coding-agent/src packages/coding-agent/test .github
          git commit -m "fix(coding-agent): preserve plan execution state across context clear"
          git fetch origin feat/plan-clear-context-session
          git rebase origin/feat/plan-clear-context-session
          git push origin HEAD:feat/plan-clear-context-session
          sha=$(git rev-parse HEAD)
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -f state=success \
            -f context='plan-clear-context/validation' \
            -f description='Format, build, and focused plan-mode tests passed'

      - name: Record validation failure
        if: failure()
        shell: bash
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=failure \
            -f context='plan-clear-context/validation' \
            -f description='Focused plan clear-context validation failed' || true

      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/finalize-plan-clear-context-pr.yml ]; then
            git rm .github/workflows/finalize-plan-clear-context-pr.yml
            git commit -m "chore: remove focused plan clear-context validator"
            git push origin main
          fi
