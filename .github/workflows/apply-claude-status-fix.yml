name: Apply Claude status fix

# This branch-local workflow is intentionally removed by the verified patch script.
on:
  push:
    branches:
      - fix/claude-completion-status

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage Claude status patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply exact source patch
        run: node .github/scripts/apply-claude-status-fix.mjs

      - name: Format and lint changed files
        run: >-
          npx biome check --write --error-on-warnings
          packages/coding-agent/src/modes/interactive/components/claude-working.ts
          packages/coding-agent/src/modes/interactive/components/custom-editor.ts
          packages/coding-agent/src/modes/interactive/components/status-indicator.ts
          packages/coding-agent/src/modes/interactive/interactive-mode.ts
          packages/coding-agent/test/claude-status.test.ts

      - name: Typecheck
        run: npx tsgo --noEmit

      - name: Run focused tests
        run: npx vitest --run packages/coding-agent/test/claude-status.test.ts

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(coding-agent): preserve Claude completion status"
          git push origin HEAD
