name: Resolve upstream batch 2 JSON protocol

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: resolve-upstream-batch2-json
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event.pull_request.head.ref == 'sync/upstream-batch2-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-batch2-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve JSON/RPC protocol changelog overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/earendil-works/pi.git 2>/dev/null || true
          git fetch upstream main --no-tags

          sha=a4475344fb765850ec5321efe3c67e6f364ead5c
          existing=$(git log --format=%H --fixed-strings --grep="Upstream-Commit: $sha" -1)
          if [ -n "$existing" ]; then
            echo "JSON protocol commit already integrated as $existing"
          else
            set +e
            git cherry-pick "$sha"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              conflicts=$(git diff --name-only --diff-filter=U)
              if [ "$conflicts" != "packages/coding-agent/CHANGELOG.md" ]; then
                echo "Unexpected conflicts:"
                printf '%s\n' "$conflicts"
                exit 1
              fi
              git checkout --ours packages/coding-agent/CHANGELOG.md
              python <<'PY'
          from pathlib import Path

          path = Path("packages/coding-agent/CHANGELOG.md")
          text = path.read_text()
          anchor = "### Changed\n\n"
          additions = (
              "- Changed JSON and RPC `message_update` events to emit only `assistantMessageEvent` deltas, removing cumulative message snapshots that caused quadratic output growth. Clients must assemble deltas between `message_start` and `message_end`; `message_end` remains authoritative.\n"
              "- `ModelRegistry.getApiKeyAndHeaders()` now preserves `null` provider-header deletion markers; callers forwarding headers to pi-ai may pass them through, while concrete HTTP consumers must filter deleted entries.\n"
          )
          if "emit only `assistantMessageEvent` deltas" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("Unexpected Changed section layout")
              text = text.replace(anchor, anchor + additions, 1)
          path.write_text(text)
          PY
              git add packages/coding-agent/CHANGELOG.md
              GIT_EDITOR=true git cherry-pick --continue
            fi

            original_message=$(git log -1 --pretty=%B)
            git commit --amend -m "${original_message%$'\n'}" -m "Upstream-Commit: $sha"
          fi

          rm -f .github/upstream-batch2-conflict.txt .github/upstream-batch2-resolve-trigger.txt
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: complete upstream batch 2 conflict resolution"
          fi
          git push origin HEAD:sync/upstream-batch2-20260805

      - name: Remove temporary resolver
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: CoderDoubleflower/pi-claude
        shell: bash
        run: |
          set -euo pipefail
          path=.github/workflows/resolve-upstream-batch2-json.yml
          file_sha=$(gh api "repos/${REPO}/contents/${path}?ref=main" --jq .sha)
          gh api --method DELETE "repos/${REPO}/contents/${path}" \
            -f message='chore: remove temporary batch 2 JSON resolver' \
            -f branch=main \
            -f sha="$file_sha" >/dev/null
