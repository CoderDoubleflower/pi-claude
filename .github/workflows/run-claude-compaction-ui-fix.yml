name: Run Claude compaction UI fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/claude-compaction-ui' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/claude-compaction-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Extract and apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-claude-compaction-ui-fix.yml').read_text()
          start_marker = "          cat > /tmp/apply_compaction_fix.py <<'PY'\n"
          end_marker = "          PY\n          python /tmp/apply_compaction_fix.py\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_compaction_fix.py').write_text(script)
          PY
          python /tmp/apply_compaction_fix.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate
        run: |
          npm run check
          cd packages/coding-agent
          node ../../node_modules/vitest/dist/cli.js --run test/claude-status.test.ts

      - name: Commit changes
        shell: bash
        run: |
          rm .github/workflows/apply-claude-compaction-ui-fix.yml
          rm .github/workflows/run-claude-compaction-ui-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/apply-claude-compaction-ui-fix.yml \
            .github/workflows/run-claude-compaction-ui-fix.yml \
            packages/coding-agent/CHANGELOG.md \
            packages/coding-agent/src/core/agent-session.ts \
            packages/coding-agent/src/modes/interactive/components/compaction-summary-message.ts \
            packages/coding-agent/src/modes/interactive/components/status-indicator.ts \
            packages/coding-agent/src/modes/interactive/interactive-mode.ts \
            packages/coding-agent/test/claude-status.test.ts
          git commit -m "fix(coding-agent): match Claude Code compaction UI"
          git push origin HEAD:fix/claude-compaction-ui
