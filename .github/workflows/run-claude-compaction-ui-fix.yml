name: Run Claude compaction UI fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/claude-compaction-ui' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/claude-compaction-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-claude-compaction-ui-fix.yml').read_text()
          start_marker = "          cat > /tmp/apply_compaction_fix.py <<'PY'\n"
          end_marker = "          PY\n          python /tmp/apply_compaction_fix.py\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          broken_start = script.index('replace_event_old =')
          broken_end = script.index('continuation_pattern =', broken_start)
          repaired_event_patch = (
              'event_marker = "\\t\\t\\twillRetry: boolean;\\n\\t\\t\\terrorMessage?: string;"\n'
              'if agent.count(event_marker) != 1:\n'
              '    raise RuntimeError("compaction event type did not match")\n'
              'agent = agent.replace(\n'
              '    event_marker,\n'
              '    "\\t\\t\\twillRetry: boolean;\\n\\t\\t\\twillContinue?: boolean;\\n\\t\\t\\terrorMessage?: string;",\n'
              '    1,\n'
              ')\n\n'
          )
          script = script[:broken_start] + repaired_event_patch + script[broken_end:]
          Path('/tmp/apply_compaction_fix.py').write_text(script)
          PY
          python /tmp/apply_compaction_fix.py
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/coding-agent/test/claude-status.test.ts')
          text = path.read_text()
          replacements = {
              '\t\tpendingTools: new Map(),\n': '\t\tpendingTools: new Map<string, never>(),\n',
              'expect(line?.endsWith("Compacting conversation…")).toBe(true);': 'expect(line?.trimEnd().endsWith("Compacting conversation…")).toBe(true);',
              'expect(collapsed[1]?.endsWith(" to expand)")).toBe(true);': 'expect(collapsed[1]?.trimEnd().endsWith(" to expand)")).toBe(true);',
              'expect(expanded[1]).toBe("● Compact summary");': 'expect(expanded[1]?.trimEnd()).toBe("● Compact summary");',
              'expect(expanded[2]).toBe("  ⎿  Retained summary");': 'expect(expanded[2]?.trimEnd()).toBe("  ⎿  Retained summary");',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f'expected one test fragment, found {text.count(old)}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate model sources
        run: npm run generate:models

      - name: Format changed files
        run: |
          npx biome check --write --error-on-warnings \
            packages/coding-agent/CHANGELOG.md \
            packages/coding-agent/src/core/agent-session.ts \
            packages/coding-agent/src/modes/interactive/components/compaction-summary-message.ts \
            packages/coding-agent/src/modes/interactive/components/status-indicator.ts \
            packages/coding-agent/src/modes/interactive/interactive-mode.ts \
            packages/coding-agent/test/claude-status.test.ts

      - name: Typecheck coding-agent scope
        shell: bash
        run: |
          cat > tsconfig.compaction-ui.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": [
              "packages/coding-agent/src/**/*.ts",
              "packages/coding-agent/test/claude-status.test.ts"
            ],
            "exclude": [
              "**/dist/**",
              "packages/coding-agent/examples/**"
            ]
          }
          JSON
          npx tsgo --noEmit -p tsconfig.compaction-ui.json
          rm tsconfig.compaction-ui.json

      - name: Run focused tests
        run: |
          cd packages/coding-agent
          node ../../node_modules/vitest/dist/cli.js --run test/claude-status.test.ts

      - name: Commit changes
        shell: bash
        run: |
          rm .github/workflows/apply-claude-compaction-ui-fix.yml
          rm .github/workflows/run-claude-compaction-ui-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/apply-claude-compaction-ui-fix.yml \
            .github/workflows/run-claude-compaction-ui-fix.yml \
            packages/coding-agent/CHANGELOG.md \
            packages/coding-agent/src/core/agent-session.ts \
            packages/coding-agent/src/modes/interactive/components/compaction-summary-message.ts \
            packages/coding-agent/src/modes/interactive/components/status-indicator.ts \
            packages/coding-agent/src/modes/interactive/interactive-mode.ts \
            packages/coding-agent/test/claude-status.test.ts
          git commit -m "fix(coding-agent): match Claude Code compaction UI"
          git push origin HEAD:fix/claude-compaction-ui
