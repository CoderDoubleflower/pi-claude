name: Apply plan mode footer label

on:
  push:
    branches:
      - fix/plan-mode-footer-label

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update plan mode footer label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/coding-agent/src/extensions/plan-mode/index.ts")
          old = 'planModeColor(ctx.ui.theme, "⏸ plan")'
          new = 'planModeColor(ctx.ui.theme, "⏸ plan mode on")'
          text = path.read_text(encoding="utf-8")
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one footer label occurrence, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/apply-plan-mode-footer-label.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src/extensions/plan-mode/index.ts .github/workflows/apply-plan-mode-footer-label.yml
          git commit -m "fix(coding-agent): update plan mode footer label"
          git push origin HEAD:${{ github.ref_name }}
