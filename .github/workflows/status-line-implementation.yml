          describe("status line command", () => {
          \tit("normalizes multi-line output", () => {
          \t\texpect(normalizeStatusLineOutput("one\r\ntwo\n")).toEqual(["one", "two"]);
          \t\texpect(normalizeStatusLineOutput("\n")).toEqual([""]);
          \t});

          \tit("passes JSON on stdin and preserves ANSI and multiple rows", async () => {
          \t\tconst directory = mkdtempSync(join(tmpdir(), "pi-status-line-"));
          \t\tconst scriptPath = join(directory, "statusline.mjs");
