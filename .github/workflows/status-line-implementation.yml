name: Implement Claude-compatible status line

on:
  push:
    branches:
      - feat/claude-compatible-status-line

permissions:
  contents: write

concurrency:
  group: status-line-implementation
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/claude-compatible-status-line
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected anchor not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          settings_path = "packages/coding-agent/src/core/settings-manager.ts"
          replace_once(
              settings_path,
              '''export interface MarkdownSettings {
          \tcodeBlockIndent?: string; // default: "  "
          }

          export interface WarningSettings {''',
              '''export interface MarkdownSettings {
          \tcodeBlockIndent?: string; // default: "  "
          }

          export interface StatusLineSettings {
          \ttype: "command";
          \tcommand: string;
          \tpadding?: number;
          \trefreshInterval?: number;
          }

          export interface WarningSettings {''',
          )
          replace_once(
              settings_path,
              '''\ttheme?: string;
          \tcompaction?: CompactionSettings;''',
              '''\ttheme?: string;
          \tstatusLine?: StatusLineSettings;
          \tcompaction?: CompactionSettings;''',
          )
          replace_once(
              settings_path,
              '''\tsetTheme(theme: string): void {
          \t\tthis.globalSettings.theme = theme;
          \t\tthis.markModified("theme");
          \t\tthis.save();
          \t}

          \tgetDefaultThinkingLevel(): ThinkingLevel | undefined {''',
              '''\tsetTheme(theme: string): void {
          \t\tthis.globalSettings.theme = theme;
          \t\tthis.markModified("theme");
          \t\tthis.save();
          \t}

          \tgetStatusLine(): StatusLineSettings | undefined {
          \t\tconst statusLine = this.settings.statusLine;
          \t\tif (
          \t\t\t!statusLine ||
          \t\t\tstatusLine.type !== "command" ||
          \t\t\ttypeof statusLine.command !== "string" ||
          \t\t\tstatusLine.command.trim().length === 0
          \t\t) {
          \t\t\treturn undefined;
          \t\t}

          \t\tconst padding =
          \t\t\ttypeof statusLine.padding === "number" && Number.isFinite(statusLine.padding)
          \t\t\t\t? Math.max(0, Math.floor(statusLine.padding))
          \t\t\t\t: undefined;
          \t\tconst refreshInterval =
          \t\t\ttypeof statusLine.refreshInterval === "number" && Number.isFinite(statusLine.refreshInterval)
          \t\t\t\t? Math.max(1, Math.floor(statusLine.refreshInterval))
          \t\t\t\t: undefined;

          \t\treturn {
          \t\t\ttype: "command",
          \t\t\tcommand: statusLine.command,
          \t\t\t...(padding !== undefined && { padding }),
          \t\t\t...(refreshInterval !== undefined && { refreshInterval }),
          \t\t};
          \t}

          \tgetDefaultThinkingLevel(): ThinkingLevel | undefined {''',
          )

          Path("packages/coding-agent/src/core/status-line.ts").write_text(r'''import { spawn } from "node:child_process";
          import type { Usage } from "@earendil-works/pi-ai/compat";
          import { VERSION } from "../config.ts";
          import type { AgentSession } from "./agent-session.ts";
          import type { ContextUsage } from "./extensions/types.ts";
          import type { ReadonlyFooterDataProvider } from "./footer-data-provider.ts";
          import type { StatusLineSettings } from "./settings-manager.ts";
          import type { UsageTotals } from "./usage-totals.ts";

          const STATUS_LINE_DEBOUNCE_MS = 300;
          const STATUS_LINE_TIMEOUT_MS = 5000;
          const STATUS_LINE_MAX_OUTPUT_BYTES = 64 * 1024;
          const STATUS_LINE_MAX_LINES = 20;

          export interface StatusLineCommandInput {
          \tcwd: string;
          \tsession_id: string;
          \ttranscript_path: string;
          \tsession_name?: string;
          \tmodel: {
          \t\tid: string;
          \t\tdisplay_name: string;
          \t};
          \tworkspace: {
          \t\tcurrent_dir: string;
          \t\tproject_dir: string;
          \t\tadded_dirs: string[];
          \t};
          \tversion: string;
          \toutput_style: {
          \t\tname: string;
          \t};
          \tcost: {
          \t\ttotal_cost_usd: number;
          \t\ttotal_duration_ms: number;
          \t\ttotal_api_duration_ms: number;
          \t\ttotal_lines_added: number;
          \t\ttotal_lines_removed: number;
          \t};
          \tcontext_window: {
          \t\ttotal_input_tokens: number;
          \t\ttotal_output_tokens: number;
          \t\tcontext_window_size: number;
          \t\tcurrent_usage: {
          \t\t\tinput_tokens: number;
          \t\t\toutput_tokens: number;
          \t\t\tcache_creation_input_tokens: number;
          \t\t\tcache_read_input_tokens: number;
          \t\t} | null;
          \t\tused_percentage: number | null;
          \t\tremaining_percentage: number | null;
          \t};
          \texceeds_200k_tokens: boolean;
          \teffort: {
          \t\tlevel: string | null;
          \t};
          \tthinking: {
          \t\tenabled: boolean;
          \t};
          \tpi: {
          \t\tgit_branch: string | null;
          \t\textension_statuses: Record<string, string>;
          \t};
          }

          export interface BuildStatusLineCommandInputOptions {
          \tsession: AgentSession;
          \tfooterData: ReadonlyFooterDataProvider;
          \tusageTotals: UsageTotals;
          \tlatestUsage: Usage | undefined;
          \tcontextUsage: ContextUsage | undefined;
          \ttotalDurationMs: number;
          }

          export function buildStatusLineCommandInput({
          \tsession,
          \tfooterData,
          \tusageTotals,
          \tlatestUsage,
          \tcontextUsage,
          \ttotalDurationMs,
          }: BuildStatusLineCommandInputOptions): StatusLineCommandInput {
          \tconst state = session.state;
          \tconst cwd = session.sessionManager.getCwd();
          \tconst modelId = state.model?.id ?? "no-model";
          \tconst modelDisplayName = state.model?.name ?? modelId;
          \tconst contextWindowSize = contextUsage?.contextWindow ?? state.model?.contextWindow ?? 0;
          \tconst usedPercentage = contextUsage?.percent ?? null;
          \tconst sessionName = session.sessionManager.getSessionName();
          \tconst thinkingLevel = state.thinkingLevel ?? "off";

          \treturn {
          \t\tcwd,
          \t\tsession_id: session.sessionManager.getSessionId(),
          \t\ttranscript_path: session.sessionManager.getSessionFile() ?? "",
          \t\t...(sessionName && { session_name: sessionName }),
          \t\tmodel: {
          \t\t\tid: modelId,
          \t\t\tdisplay_name: modelDisplayName,
          \t\t},
          \t\tworkspace: {
          \t\t\tcurrent_dir: cwd,
          \t\t\tproject_dir: cwd,
          \t\t\tadded_dirs: [],
          \t\t},
          \t\tversion: VERSION,
          \t\toutput_style: {
          \t\t\tname: "default",
          \t\t},
          \t\tcost: {
          \t\t\ttotal_cost_usd: usageTotals.cost,
          \t\t\ttotal_duration_ms: Math.max(0, Math.floor(totalDurationMs)),
          \t\t\ttotal_api_duration_ms: 0,
          \t\t\ttotal_lines_added: 0,
          \t\t\ttotal_lines_removed: 0,
          \t\t},
          \t\tcontext_window: {
          \t\t\ttotal_input_tokens: usageTotals.input + usageTotals.cacheRead + usageTotals.cacheWrite,
          \t\t\ttotal_output_tokens: usageTotals.output,
          \t\t\tcontext_window_size: contextWindowSize,
          \t\t\tcurrent_usage: latestUsage
          \t\t\t\t? {
          \t\t\t\t\tinput_tokens: latestUsage.input,
          \t\t\t\t\toutput_tokens: latestUsage.output,
          \t\t\t\t\tcache_creation_input_tokens: latestUsage.cacheWrite,
          \t\t\t\t\tcache_read_input_tokens: latestUsage.cacheRead,
          \t\t\t\t}
          \t\t\t\t: null,
          \t\t\tused_percentage: usedPercentage,
          \t\t\tremaining_percentage: usedPercentage === null ? null : Math.max(0, 100 - usedPercentage),
          \t\t},
          \t\texceeds_200k_tokens: (contextUsage?.tokens ?? 0) > 200_000,
          \t\teffort: {
          \t\t\tlevel: thinkingLevel,
          \t\t},
          \t\tthinking: {
          \t\t\tenabled: thinkingLevel !== "off",
          \t\t},
          \t\tpi: {
          \t\t\tgit_branch: footerData.getGitBranch(),
          \t\t\textension_statuses: Object.fromEntries(footerData.getExtensionStatuses()),
          \t\t},
          \t};
          }

          export function normalizeStatusLineOutput(output: string): string[] {
          \tconst normalized = output.replace(/\r\n/g, "\n").replace(/\r/g, "\n").replace(/\n+$/g, "");
          \tif (normalized.length === 0) return [""];
          \treturn normalized.split("\n").slice(0, STATUS_LINE_MAX_LINES);
          }

          export interface StatusLineRequest {
          \tinput: StatusLineCommandInput;
          \tcwd: string;
          \tcolumns: number;
          }

          export interface StatusLineRenderState {
          \tlines: string[];
          \tpadding: number;
          }

          interface PendingStatusLineRequest extends StatusLineRequest {
          \tsettings: StatusLineSettings;
          \tsignature: string;
          }

          function arraysEqual(left: readonly string[], right: readonly string[]): boolean {
          \treturn left.length === right.length && left.every((value, index) => value === right[index]);
          }

          export class StatusLineCommandRunner {
          \tprivate outputLines: string[] = [""];
          \tprivate configSignature: string | undefined;
          \tprivate scheduledSignature: string | undefined;
          \tprivate latestRequest: PendingStatusLineRequest | undefined;
          \tprivate debounceTimer: ReturnType<typeof setTimeout> | undefined;
          \tprivate refreshTimer: ReturnType<typeof setInterval> | undefined;
          \tprivate activeAbortController: AbortController | undefined;
          \tprivate executionGeneration = 0;
          \tprivate disposed = false;

          \tconstructor(private readonly requestRender: () => void = () => {}) {}

          \tupdate(settings: undefined): undefined;
          \tupdate(settings: StatusLineSettings, request: StatusLineRequest): StatusLineRenderState;
          \tupdate(
          \t\tsettings: StatusLineSettings | undefined,
          \t\trequest?: StatusLineRequest,
          \t): StatusLineRenderState | undefined {
          \t\tif (!settings) {
          \t\t\tthis.disable();
          \t\t\treturn undefined;
          \t\t}
          \t\tif (!request) {
          \t\t\tthrow new Error("Status line request data is required when statusLine is enabled");
          \t\t}

          \t\tconst configSignature = JSON.stringify(settings);
          \t\tif (configSignature !== this.configSignature) {
          \t\t\tthis.configSignature = configSignature;
          \t\t\tthis.outputLines = [""];
          \t\t\tthis.scheduledSignature = undefined;
          \t\t\tthis.configureRefresh(settings.refreshInterval);
          \t\t}

          \t\tconst signature = JSON.stringify([configSignature, request.columns, request.input]);
          \t\tthis.latestRequest = { settings, ...request, signature };
          \t\tif (signature !== this.scheduledSignature) {
          \t\t\tthis.scheduledSignature = signature;
          \t\t\tthis.scheduleExecution();
          \t\t}

          \t\treturn {
          \t\t\tlines: [...this.outputLines],
          \t\t\tpadding: settings.padding ?? 0,
          \t\t};
          \t}

          \tinvalidate(): void {
          \t\tif (!this.latestRequest) return;
          \t\tthis.scheduleExecution();
          \t}

          \tdispose(): void {
          \t\tthis.disposed = true;
          \t\tthis.executionGeneration += 1;
          \t\tthis.activeAbortController?.abort();
          \t\tthis.activeAbortController = undefined;
          \t\tif (this.debounceTimer) clearTimeout(this.debounceTimer);
          \t\tif (this.refreshTimer) clearInterval(this.refreshTimer);
          \t\tthis.debounceTimer = undefined;
          \t\tthis.refreshTimer = undefined;
          \t}

          \tprivate disable(): void {
          \t\tif (this.configSignature === undefined && !this.latestRequest) return;
          \t\tthis.executionGeneration += 1;
          \t\tthis.activeAbortController?.abort();
          \t\tthis.activeAbortController = undefined;
          \t\tif (this.debounceTimer) clearTimeout(this.debounceTimer);
          \t\tif (this.refreshTimer) clearInterval(this.refreshTimer);
          \t\tthis.debounceTimer = undefined;
          \t\tthis.refreshTimer = undefined;
          \t\tthis.configSignature = undefined;
          \t\tthis.scheduledSignature = undefined;
          \t\tthis.latestRequest = undefined;
          \t\tthis.outputLines = [""];
          \t}

          \tprivate configureRefresh(refreshInterval: number | undefined): void {
          \t\tif (this.refreshTimer) clearInterval(this.refreshTimer);
          \t\tthis.refreshTimer = undefined;
          \t\tif (refreshInterval === undefined) return;
          \t\tthis.refreshTimer = setInterval(() => this.scheduleExecution(), refreshInterval * 1000);
          \t\tthis.refreshTimer.unref?.();
          \t}

          \tprivate scheduleExecution(): void {
          \t\tif (this.disposed || !this.latestRequest) return;
          \t\tif (this.debounceTimer) clearTimeout(this.debounceTimer);
          \t\tthis.debounceTimer = setTimeout(() => {
          \t\t\tthis.debounceTimer = undefined;
          \t\t\tthis.executeLatest();
          \t\t}, STATUS_LINE_DEBOUNCE_MS);
          \t\tthis.debounceTimer.unref?.();
          \t}

          \tprivate executeLatest(): void {
          \t\tconst request = this.latestRequest;
          \t\tif (this.disposed || !request) return;

          \t\tthis.activeAbortController?.abort();
          \t\tconst controller = new AbortController();
          \t\tthis.activeAbortController = controller;
          \t\tconst generation = ++this.executionGeneration;
          \t\tlet stdout = "";
          \t\tlet outputBytes = 0;
          \t\tlet settled = false;

          \t\tconst finish = (lines?: string[]) => {
          \t\t\tif (settled) return;
          \t\t\tsettled = true;
          \t\t\tif (generation !== this.executionGeneration || controller.signal.aborted || this.disposed) return;
          \t\t\tif (this.activeAbortController === controller) this.activeAbortController = undefined;
          \t\t\tif (!lines || arraysEqual(lines, this.outputLines)) return;
          \t\t\tthis.outputLines = lines;
          \t\t\tthis.requestRender();
          \t\t};

          \t\tlet child: ReturnType<typeof spawn>;
          \t\ttry {
          \t\t\tchild = spawn(request.settings.command, {
          \t\t\t\tcwd: request.cwd,
          \t\t\t\tenv: {
          \t\t\t\t\t...process.env,
          \t\t\t\t\tCOLUMNS: String(Math.max(1, Math.floor(request.columns))),
          \t\t\t\t\tLINES: String(process.stdout.rows ?? 0),
          \t\t\t\t},
          \t\t\t\tshell: true,
          \t\t\t\tsignal: controller.signal,
          \t\t\t\tstdio: ["pipe", "pipe", "ignore"],
          \t\t\t\twindowsHide: true,
          \t\t\t});
          \t\t} catch {
          \t\t\tfinish();
          \t\t\treturn;
          \t\t}

          \t\tconst timeout = setTimeout(() => controller.abort(), STATUS_LINE_TIMEOUT_MS);
          \t\ttimeout.unref?.();
          \t\tchild.stdout?.setEncoding("utf8");
          \t\tchild.stdout?.on("data", (chunk: string) => {
          \t\t\toutputBytes += Buffer.byteLength(chunk);
          \t\t\tif (outputBytes > STATUS_LINE_MAX_OUTPUT_BYTES) {
          \t\t\t\tcontroller.abort();
          \t\t\t\treturn;
          \t\t\t}
          \t\t\tstdout += chunk;
          \t\t});
          \t\tchild.stdin?.on("error", () => {});
          \t\tchild.once("error", () => {
          \t\t\tclearTimeout(timeout);
          \t\t\tfinish();
          \t\t});
          \t\tchild.once("close", (code) => {
          \t\t\tclearTimeout(timeout);
          \t\t\tfinish(code === 0 ? normalizeStatusLineOutput(stdout) : undefined);
          \t\t});
          \t\tchild.stdin?.end(JSON.stringify(request.input));
          \t}
          }
          ''')

          footer_path = "packages/coding-agent/src/modes/interactive/components/footer.ts"
          replace_once(
              footer_path,
              '''import { type Component, truncateToWidth, visibleWidth } from "@earendil-works/pi-tui";
          import type { AgentSession } from "../../../core/agent-session.ts";''',
              '''import type { Usage } from "@earendil-works/pi-ai/compat";
          import { type Component, truncateToWidth, visibleWidth } from "@earendil-works/pi-tui";
          import type { AgentSession } from "../../../core/agent-session.ts";''',
          )
          replace_once(
              footer_path,
              '''import type { ReadonlyFooterDataProvider } from "../../../core/footer-data-provider.ts";
          import { addUsageToTotals, createUsageTotals } from "../../../core/usage-totals.ts";''',
              '''import type { ReadonlyFooterDataProvider } from "../../../core/footer-data-provider.ts";
          import { buildStatusLineCommandInput, StatusLineCommandRunner } from "../../../core/status-line.ts";
          import { addUsageToTotals, createUsageTotals } from "../../../core/usage-totals.ts";''',
          )
          replace_once(
              footer_path,
              '''function sanitizeStatusText(text: string): string {
          \t// Replace newlines, tabs, carriage returns with space, then collapse multiple spaces
          \treturn text
          \t\t.replace(/[\\r\\n\\t]/g, " ")
          \t\t.replace(/ +/g, " ")
          \t\t.trim();
          }

          /**
           * Format token counts for compact footer display.
           */''',
              '''function sanitizeStatusText(text: string): string {
          \t// Replace newlines, tabs, carriage returns with space, then collapse multiple spaces
          \treturn text
          \t\t.replace(/[\\r\\n\\t]/g, " ")
          \t\t.replace(/ +/g, " ")
          \t\t.trim();
          }

          export function appendExtensionStatuses(
          \tlines: string[],
          \textensionStatuses: ReadonlyMap<string, string>,
          \twidth: number,
          ): string[] {
          \tif (extensionStatuses.size === 0) return lines;
          \tconst sortedStatuses = Array.from(extensionStatuses.entries())
          \t\t.sort(([a], [b]) => a.localeCompare(b))
          \t\t.map(([, text]) => sanitizeStatusText(text));
          \tconst statusLine = sortedStatuses.join(" ");
          \treturn [...lines, truncateToWidth(statusLine, width, theme.fg("dim", "..."))];
          }

          /**
           * Format token counts for compact footer display.
           */''',
          )
          replace_once(
              footer_path,
              '''\tprivate footerData: ReadonlyFooterDataProvider;
          \tprivate startupHeaderUpgradeCleanup: (() => void) | undefined;

          \tconstructor(session: AgentSession, footerData: ReadonlyFooterDataProvider) {
          \t\tthis.session = session;
          \t\tthis.footerData = footerData;
          \t\tthis.startupHeaderUpgradeCleanup = installClaudeStartupHeaderUpgrade(() => this.session);
          \t}

          \tsetSession(session: AgentSession): void {
          \t\tthis.session = session;
          \t}''',
              '''\tprivate footerData: ReadonlyFooterDataProvider;
          \tprivate startupHeaderUpgradeCleanup: (() => void) | undefined;
          \tprivate statusLineRunner: StatusLineCommandRunner;
          \tprivate sessionStartedAt = Date.now();

          \tconstructor(session: AgentSession, footerData: ReadonlyFooterDataProvider, requestRender: () => void = () => {}) {
          \t\tthis.session = session;
          \t\tthis.footerData = footerData;
          \t\tthis.statusLineRunner = new StatusLineCommandRunner(requestRender);
          \t\tthis.startupHeaderUpgradeCleanup = installClaudeStartupHeaderUpgrade(() => this.session);
          \t}

          \tsetSession(session: AgentSession): void {
          \t\tthis.session = session;
          \t\tthis.sessionStartedAt = Date.now();
          \t\tthis.statusLineRunner.invalidate();
          \t}''',
          )
          replace_once(
              footer_path,
              '''\t/**
          \t * No-op: git branch caching now handled by provider.
          \t * Kept for compatibility with existing call sites in interactive-mode.
          \t */
          \tinvalidate(): void {
          \t\t// No-op: git branch is cached/invalidated by provider
          \t}''',
              '''\tinvalidate(): void {
          \t\tthis.statusLineRunner.invalidate();
          \t}''',
          )
          replace_once(
              footer_path,
              '''\tdispose(): void {
          \t\tthis.startupHeaderUpgradeCleanup?.();
          \t\tthis.startupHeaderUpgradeCleanup = undefined;
          \t}''',
              '''\tdispose(): void {
          \t\tthis.statusLineRunner.dispose();
          \t\tthis.startupHeaderUpgradeCleanup?.();
          \t\tthis.startupHeaderUpgradeCleanup = undefined;
          \t}''',
          )
          replace_once(
              footer_path,
              '''\t\tconst usageTotals = createUsageTotals();
          \t\tlet latestCacheHitRate: number | undefined;''',
              '''\t\tconst usageTotals = createUsageTotals();
          \t\tlet latestCacheHitRate: number | undefined;
          \t\tlet latestAssistantUsage: Usage | undefined;''',
          )
          replace_once(
              footer_path,
              '''\t\t\tif (entry.type === "message" && entry.message.role === "assistant") {
          \t\t\t\taddUsageToTotals(usageTotals, entry.message.usage);''',
              '''\t\t\tif (entry.type === "message" && entry.message.role === "assistant") {
          \t\t\t\tlatestAssistantUsage = entry.message.usage;
          \t\t\t\taddUsageToTotals(usageTotals, entry.message.usage);''',
          )
          replace_once(
              footer_path,
              '''\t\tconst pwdLine = truncateToWidth(theme.fg("dim", pwd), width, theme.fg("dim", "..."));
          \t\tconst lines = [pwdLine, dimStatsLeft + dimRemainder];

          \t\t// Add extension statuses on a single line, sorted by key alphabetically
          \t\tconst extensionStatuses = this.footerData.getExtensionStatuses();
          \t\tif (extensionStatuses.size > 0) {
          \t\t\tconst sortedStatuses = Array.from(extensionStatuses.entries())
          \t\t\t\t.sort(([a], [b]) => a.localeCompare(b))
          \t\t\t\t.map(([, text]) => sanitizeStatusText(text));
          \t\t\tconst statusLine = sortedStatuses.join(" ");
          \t\t\t// Truncate to terminal width with dim ellipsis for consistency with footer style
          \t\t\tlines.push(truncateToWidth(statusLine, width, theme.fg("dim", "...")));
          \t\t}

          \t\treturn lines;''',
              '''\t\tconst pwdLine = truncateToWidth(theme.fg("dim", pwd), width, theme.fg("dim", "..."));
          \t\tconst statusLineSettings = this.session.settingsManager.getStatusLine();
          \t\tconst customStatusLine = statusLineSettings
          \t\t\t? this.statusLineRunner.update(statusLineSettings, {
          \t\t\t\tinput: buildStatusLineCommandInput({
          \t\t\t\t\tsession: this.session,
          \t\t\t\t\tfooterData: this.footerData,
          \t\t\t\t\tusageTotals,
          \t\t\t\t\tlatestUsage: latestAssistantUsage,
          \t\t\t\t\tcontextUsage,
          \t\t\t\t\ttotalDurationMs: Date.now() - this.sessionStartedAt,
          \t\t\t\t}),
          \t\t\t\tcwd: this.session.sessionManager.getCwd(),
          \t\t\t\tcolumns: width,
          \t\t\t})
          \t\t\t: this.statusLineRunner.update(undefined);
          \t\tconst lines = customStatusLine
          \t\t\t? customStatusLine.lines.map((line) => {
          \t\t\t\tconst padding = " ".repeat(Math.min(customStatusLine.padding, Math.max(0, width - 1)));
          \t\t\t\treturn `${padding}${truncateToWidth(line, Math.max(1, width - visibleWidth(padding)), "")}`;
          \t\t\t})
