name: Apply plan-mode unknown-tool confirmation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plan-mode-readonly-capabilities
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run hydrate:model-data
      - run: python3 scripts/apply-plan-mode-unknown-tool-confirm.py
      - run: npx biome check --write packages/coding-agent/src/extensions/plan-mode/index.ts packages/coding-agent/test/plan-mode.test.ts
      - run: npm --prefix packages/coding-agent test -- test/plan-mode.test.ts
      - run: npm run build

      - name: Commit verified confirmation policy
        run: |
          rm -f scripts/apply-plan-mode-unknown-tool-confirm.py
          rm -f .github/workflows/apply-plan-mode-unknown-tool-confirm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            packages/coding-agent/src/extensions/plan-mode/index.ts \
            packages/coding-agent/test/plan-mode.test.ts \
            scripts/apply-plan-mode-unknown-tool-confirm.py \
            .github/workflows/apply-plan-mode-unknown-tool-confirm.yml
          git commit -m "fix(coding-agent): confirm unknown tools in plan mode"
          git push origin HEAD:fix/plan-mode-readonly-capabilities
