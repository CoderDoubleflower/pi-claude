name: Apply plan clear-context termination fix v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-plan-clear-context-termination-v2.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/plan-clear-context-no-extra-turn
          fetch-depth: 0

      - name: Apply source and test changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          plan_path = Path("packages/coding-agent/src/extensions/plan-mode/index.ts")
          text = plan_path.read_text()
          old = '''\t\t\t\t\treturn textResult(
          \t\t\t\t\t\t"User approved the plan and requested a clean execution context. End this turn now; implementation will start in a fresh session.",
          \t\t\t\t\t\t{
          \t\t\t\t\t\t\tkind: "approved-clear",
          \t\t\t\t\t\t\ttitle: "User approved Claude's plan",
          \t\t\t\t\t\t\tsubtitle: "Context will be cleared before implementation.",
          \t\t\t\t\t\t\tplanPath: state.planPath,
          \t\t\t\t\t\t\tplan,
          \t\t\t\t\t\t},
          \t\t\t\t\t);'''
          new = '''\t\t\t\t\treturn {
          \t\t\t\t\t\t...textResult(
          \t\t\t\t\t\t\t"User approved the plan and requested a clean execution context. End this turn now; implementation will start in a fresh session.",
          \t\t\t\t\t\t\t{
          \t\t\t\t\t\t\t\tkind: "approved-clear",
          \t\t\t\t\t\t\t\ttitle: "User approved Claude's plan",
          \t\t\t\t\t\t\t\tsubtitle: "Context will be cleared before implementation.",
          \t\t\t\t\t\t\t\tplanPath: state.planPath,
          \t\t\t\t\t\t\t\tplan,
          \t\t\t\t\t\t\t},
          \t\t\t\t\t\t),
          \t\t\t\t\t\tterminate: true,
          \t\t\t\t\t};'''
          if "terminate: true" not in text[text.index('if (choice === "Yes, clear context and start implementing")'):text.index("const feedback =", text.index('if (choice === "Yes, clear context and start implementing")'))]:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one clear-context result block, found {text.count(old)}")
              plan_path.write_text(text.replace(old, new, 1))

          test_path = Path("packages/coding-agent/test/plan-mode-clear-context-termination.test.ts")
          test_path.write_text(
              dedent(
                  '''
                  import { readFileSync } from "node:fs";
                  import { describe, expect, it } from "vitest";

                  describe("clear-context plan approval", () => {
                  \tit("terminates the old agent run before starting the fresh execution session", () => {
                  \t\tconst source = readFileSync(new URL("../src/extensions/plan-mode/index.ts", import.meta.url), "utf8");
                  \t\tconst start = source.indexOf('if (choice === "Yes, clear context and start implementing")');
                  \t\tconst end = source.indexOf("const feedback =", start);

                  \t\texpect(start).toBeGreaterThanOrEqual(0);
                  \t\texpect(end).toBeGreaterThan(start);

                  \t\tconst clearContextBranch = source.slice(start, end);
                  \t\texpect(clearContextBranch).toContain('phase: "awaiting-clear-context"');
                  \t\texpect(clearContextBranch).toContain("terminate: true");
                  \t});
                  });
                  '''
              ).lstrip()
          )
          PY

          rm -f .github/workflows/apply-plan-clear-context-termination.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run focused plan-mode tests
        run: npx vitest --run packages/coding-agent/test/plan-mode-clear-context-termination.test.ts packages/coding-agent/test/plan-mode.test.ts

      - name: Build monorepo
        run: npm run build

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(coding-agent): stop old turn after clean plan approval"
          git push origin HEAD:fix/plan-clear-context-no-extra-turn

      - name: Remove trigger workflow from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/trigger-plan-clear-context-termination-v2.yml ]; then
            git rm .github/workflows/trigger-plan-clear-context-termination-v2.yml
            git commit -m "chore: remove plan clear-context termination retry trigger"
            git push origin main
          fi
