name: Apply thinking tool boundary fix

on:
  push:
    branches:
      - fix/thinking-tool-activity-boundary
    paths:
      - .github/workflows/apply-thinking-tool-boundary.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/thinking-tool-activity-boundary
          fetch-depth: 0

      - name: Apply source and regression test
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("packages/coding-agent/src/modes/interactive/interactive-mode.ts")
          source = path.read_text()

          import_line = 'import { getToolActivityKind, ToolActivityGroupComponent } from "./components/tool-activity-group.ts";\n'
          boundary_import = '''import {
          \tgetToolActivityEdgeBoundaries,
          \tgetToolActivityStreamActions,
          } from "./tool-activity-boundaries.ts";
          '''
          if boundary_import not in source:
              if source.count(import_line) != 1:
                  raise SystemExit("tool activity import anchor not found exactly once")
              source = source.replace(import_line, import_line + boundary_import, 1)

          old_stream_prefix = '''\t\t\t\t\tfor (const content of this.streamingMessage.content) {
          \t\t\t\t\t\tif (content.type === "text" && content.text.trim().length > 0) {
          \t\t\t\t\t\t\tif (typeof this.breakToolActivityGroup === "function") this.breakToolActivityGroup();
          \t\t\t\t\t\t\tcontinue;
          \t\t\t\t\t\t}
          \t\t\t\t\t\tif (content.type === "toolCall") {
          '''
          new_stream_prefix = '''\t\t\t\t\tfor (const action of getToolActivityStreamActions(this.streamingMessage.content)) {
          \t\t\t\t\t\tif (action.type === "break") {
          \t\t\t\t\t\t\tif (typeof this.breakToolActivityGroup === "function") this.breakToolActivityGroup();
          \t\t\t\t\t\t\tcontinue;
          \t\t\t\t\t\t}
          \t\t\t\t\t\tconst content = action.content;
          \t\t\t\t\t\tif (content.type === "toolCall") {
          '''
          if old_stream_prefix not in source:
              raise SystemExit("streaming tool grouping anchor not found")
          source = source.replace(old_stream_prefix, new_stream_prefix, 1)

          old_history = '''\t\t\t\tconst firstToolIndex = message.content.findIndex((content) => content.type === "toolCall");
          \t\t\t\tlet lastToolIndex = -1;
          \t\t\t\tfor (let index = message.content.length - 1; index >= 0; index -= 1) {
          \t\t\t\t\tif (message.content[index]?.type === "toolCall") {
          \t\t\t\t\t\tlastToolIndex = index;
          \t\t\t\t\t\tbreak;
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t\tconst hasTextBeforeTools = message.content
          \t\t\t\t\t.slice(0, firstToolIndex < 0 ? message.content.length : firstToolIndex)
          \t\t\t\t\t.some((content) => content.type === "text" && content.text.trim().length > 0);
          \t\t\t\tconst hasTextAfterTools =
          \t\t\t\t\tlastToolIndex >= 0 &&
          \t\t\t\t\tmessage.content
          \t\t\t\t\t\t.slice(lastToolIndex + 1)
          \t\t\t\t\t\t.some((content) => content.type === "text" && content.text.trim().length > 0);
          \t\t\t\tif (firstToolIndex < 0 || hasTextBeforeTools) this.breakToolActivityGroup();
          '''
          new_history = '''\t\t\t\tconst { hasToolCalls, breakBeforeTools, breakAfterTools } = getToolActivityEdgeBoundaries(
          \t\t\t\t\tmessage.content,
          \t\t\t\t);
          \t\t\t\tif (!hasToolCalls || breakBeforeTools) this.breakToolActivityGroup();
          '''
          if old_history not in source:
              raise SystemExit("history tool grouping anchor not found")
          source = source.replace(old_history, new_history, 1)

          if source.count("if (hasTextAfterTools) this.breakToolActivityGroup();") != 1:
              raise SystemExit("history trailing boundary anchor not found exactly once")
          source = source.replace(
              "if (hasTextAfterTools) this.breakToolActivityGroup();",
              "if (breakAfterTools) this.breakToolActivityGroup();",
              1,
          )
          path.write_text(source)

          boundary_path = Path("packages/coding-agent/src/modes/interactive/tool-activity-boundaries.ts")
          boundary_path.write_text('''import type { AssistantMessage } from "@earendil-works/pi-ai/compat";

          type AssistantContent = AssistantMessage["content"][number];
          type ToolCallContent = Extract<AssistantContent, { type: "toolCall" }>;

          export type ToolActivityStreamAction =
          \t| { type: "break" }
          \t| { type: "toolCall"; content: ToolCallContent };

          export interface ToolActivityEdgeBoundaries {
          \thasToolCalls: boolean;
          \tbreakBeforeTools: boolean;
          \tbreakAfterTools: boolean;
          }

          export function isVisibleAssistantContent(content: AssistantContent): boolean {
          \tif (content.type === "text") return content.text.trim().length > 0;
          \tif (content.type === "thinking") return content.thinking.trim().length > 0;
          \treturn false;
          }

          export function getToolActivityStreamActions(
          \tcontent: readonly AssistantContent[],
          ): ToolActivityStreamAction[] {
          \tconst actions: ToolActivityStreamAction[] = [];
          \tlet hasPendingVisibleBoundary = false;

          \tfor (const item of content) {
          \t\tif (isVisibleAssistantContent(item)) {
          \t\t\thasPendingVisibleBoundary = true;
          \t\t\tcontinue;
          \t\t}
          \t\tif (item.type !== "toolCall") continue;

          \t\tif (hasPendingVisibleBoundary) {
          \t\t\tactions.push({ type: "break" });
          \t\t\thasPendingVisibleBoundary = false;
          \t\t}
          \t\tactions.push({ type: "toolCall", content: item });
          \t}

          \tif (hasPendingVisibleBoundary) actions.push({ type: "break" });
          \treturn actions;
          }

          export function getToolActivityEdgeBoundaries(
          \tcontent: readonly AssistantContent[],
          ): ToolActivityEdgeBoundaries {
          \tconst firstToolIndex = content.findIndex((item) => item.type === "toolCall");
          \tif (firstToolIndex < 0) {
          \t\treturn { hasToolCalls: false, breakBeforeTools: true, breakAfterTools: false };
          \t}

          \tlet lastToolIndex = firstToolIndex;
          \tfor (let index = content.length - 1; index > firstToolIndex; index -= 1) {
          \t\tif (content[index]?.type === "toolCall") {
          \t\t\tlastToolIndex = index;
          \t\t\tbreak;
          \t\t}
          \t}

          \treturn {
          \t\thasToolCalls: true,
          \t\tbreakBeforeTools: content.slice(0, firstToolIndex).some(isVisibleAssistantContent),
          \t\tbreakAfterTools: content.slice(lastToolIndex + 1).some(isVisibleAssistantContent),
          \t};
          }
          ''')

          test_path = Path("packages/coding-agent/test/tool-activity-boundaries.test.ts")
          test_path.write_text('''import type { AssistantMessage } from "@earendil-works/pi-ai/compat";
          import { describe, expect, it } from "vitest";
          import {
          \tgetToolActivityEdgeBoundaries,
          \tgetToolActivityStreamActions,
          } from "../src/modes/interactive/tool-activity-boundaries.ts";

          type AssistantContent = AssistantMessage["content"][number];

          function toolCall(id: string): AssistantContent {
          \treturn { type: "toolCall", id, name: "bash", arguments: { command: `echo ${id}` } };
          }

          function actionLabels(content: AssistantContent[]): string[] {
          \treturn getToolActivityStreamActions(content).map((action) =>
          \t\taction.type === "break" ? "break" : `tool:${action.content.id}`,
          \t);
          }

          describe("tool activity boundaries", () => {
          \tit("separates a later tool call from an earlier group when thinking is visible", () => {
          \t\texpect(
          \t\t\tactionLabels([
          \t\t\t\ttoolCall("before"),
          \t\t\t\t{ type: "thinking", thinking: "inspect the result" },
          \t\t\t\ttoolCall("after"),
          \t\t\t]),
          \t\t).toEqual(["tool:before", "break", "tool:after"]);
          \t});

          \tit("keeps consecutive tools after one thinking block in the same group", () => {
          \t\texpect(
          \t\t\tactionLabels([
          \t\t\t\t{ type: "thinking", thinking: "plan both calls" },
          \t\t\t\ttoolCall("one"),
          \t\t\t\ttoolCall("two"),
          \t\t\t]),
          \t\t).toEqual(["break", "tool:one", "tool:two"]);
          \t});

          \tit("breaks the active group after trailing visible assistant content", () => {
          \t\texpect(actionLabels([toolCall("one"), { type: "text", text: "done" }])).toEqual([
          \t\t\t"tool:one",
          \t\t\t"break",
          \t\t]);
          \t});

          \tit("ignores empty thinking blocks", () => {
          \t\texpect(actionLabels([toolCall("one"), { type: "thinking", thinking: "  " }, toolCall("two")])).toEqual([
          \t\t\t"tool:one",
          \t\t\t"tool:two",
          \t\t]);
          \t});

          \tit("uses thinking as a history boundary before and after tools", () => {
          \t\texpect(
          \t\t\tgetToolActivityEdgeBoundaries([
          \t\t\t\t{ type: "thinking", thinking: "before" },
          \t\t\t\ttoolCall("one"),
          \t\t\t\t{ type: "thinking", thinking: "after" },
          \t\t\t]),
          \t\t).toEqual({ hasToolCalls: true, breakBeforeTools: true, breakAfterTools: true });
          \t});
          });
          ''')
          PY

      - name: Format changed files
        run: |
          npx --yes @biomejs/biome@2.3.5 check --write \
            packages/coding-agent/src/modes/interactive/interactive-mode.ts \
            packages/coding-agent/src/modes/interactive/tool-activity-boundaries.ts \
            packages/coding-agent/test/tool-activity-boundaries.test.ts
          git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Focused regression test
        run: npm --prefix packages/coding-agent test -- tool-activity-boundaries.test.ts

      - name: Commit validated fix
        run: |
          rm .github/workflows/apply-thinking-tool-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(coding-agent): separate tool groups across thinking"
          git push origin HEAD:fix/thinking-tool-activity-boundary
