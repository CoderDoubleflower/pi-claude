name: Validate internal tool call rendering v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/internal-tool-call-rendering
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace
        run: npm run build

      - name: Run focused regressions
        run: npx vitest --run packages/coding-agent/test/tool-execution-spacing.test.ts packages/coding-agent/test/plan-mode.test.ts

      - name: Remove temporary validation workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-internal-tool-call-rendering-v2.yml
          git commit -m "chore: remove focused internal tool validation workflow v2"
          git push origin HEAD:fix/internal-tool-call-rendering
