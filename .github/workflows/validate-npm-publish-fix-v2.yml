name: Validate npm publish fix v2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Run complete pre-publish validation
        shell: bash
        run: |
          set +e
          report=/tmp/npm-publish-fix-v2-validation.md
          echo '# npm publish fix v2 validation' > "$report"
          echo >> "$report"

          run_step() {
            name="$1"
            shift
            echo "## $name" >> "$report"
            echo '```text' >> "$report"
            "$@" >/tmp/validation-step.log 2>&1
            status=$?
            tail -n 80 /tmp/validation-step.log >> "$report"
            echo '```' >> "$report"
            echo "Exit code: $status" >> "$report"
            echo >> "$report"
            if [ "$status" -ne 0 ]; then
              echo "Result: FAILED at $name" >> "$report"
              return "$status"
            fi
          }

          run_step npm-latest npm install --global npm@latest || true
          if ! grep -q '^Result: FAILED' "$report"; then run_step prepare node scripts/prepare-pi-claude-release.mjs patch || true; fi
          if ! grep -q '^Result: FAILED' "$report"; then run_step refresh-lock npm install --package-lock-only --ignore-scripts || true; fi
          if ! grep -q '^Result: FAILED' "$report"; then run_step shrinkwrap node scripts/generate-coding-agent-shrinkwrap.mjs || true; fi
          if ! grep -q '^Result: FAILED' "$report"; then run_step install-lock node scripts/generate-coding-agent-install-lock.mjs || true; fi
          if ! grep -q '^Result: FAILED' "$report"; then run_step npm-ci npm ci --ignore-scripts || true; fi
          if ! grep -q '^Result: FAILED' "$report"; then run_step apt-update sudo apt-get update || true; fi
          if ! grep -q '^Result: FAILED' "$report"; then run_step apt-tools sudo apt-get install --yes fd-find ripgrep || true; fi
          if ! grep -q '^Result: FAILED' "$report"; then sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd; fi
          if ! grep -q '^Result: FAILED' "$report"; then run_step hydrate-model-data npm run hydrate:model-data || true; fi
          if ! grep -q '^Result: FAILED' "$report"; then run_step build npm run build:offline || true; fi
          if ! grep -q '^Result: FAILED' "$report"; then run_step tests npm test --workspace=@doubleflower/pi-claude || true; fi
          if ! grep -q '^Result: FAILED' "$report"; then run_step check-shrinkwrap npm run check:shrinkwrap || true; fi
          if ! grep -q '^Result: FAILED' "$report"; then run_step check-install-lock npm run check:install-lock:coding-agent || true; fi
          if ! grep -q '^Result: FAILED' "$report"; then run_step pack npm pack --dry-run --ignore-scripts --workspace=@doubleflower/pi-claude || true; fi
          if ! grep -q '^Result: FAILED' "$report"; then echo 'Result: PASSED' >> "$report"; fi

      - name: Record result and remove validation workflow
        if: always()
        shell: bash
        run: |
          cp /tmp/npm-publish-fix-v2-validation.md /tmp/validation-report.md
          git reset --hard HEAD
          git clean -fd
          mkdir -p .ai-bridge
          cp /tmp/validation-report.md .ai-bridge/npm-publish-fix-v2-validation.md
          rm -f .github/workflows/validate-npm-publish-fix-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ai-bridge/npm-publish-fix-v2-validation.md .github/workflows/validate-npm-publish-fix-v2.yml
          git commit -m "chore: record npm publish fix v2 validation"
          git push origin HEAD:main
