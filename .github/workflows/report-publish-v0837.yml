name: Report pi-claude v0.83.7 publish status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/report-publish-v0837.yml

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record publish workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: 2c6d4ff2e621863d3c454c2fef49cdaaad579575
        run: |
          gh run list -R CoderDoubleflower/pi-claude --workflow publish-npm.yml --limit 20 --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url > .github/release-v0837-status.json
          cat .github/release-v0837-status.json

      - name: Commit status report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-v0837-status.json
          git commit -m "chore: refresh v0.83.7 publish status"
          git pull --rebase origin main
          git push origin HEAD:main
