name: Verify built startup runtime

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - verify/startup-runtime-20260803

permissions:
  contents: read

jobs:
  build-and-launch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build repository
        run: npm run build

      - name: Launch built CLI in a PTY
        run: node scripts/verify-built-startup-runtime.mjs
