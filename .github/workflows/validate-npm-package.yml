name: Validate npm package

on:
  push:
    branches:
      - chore/npm-package-identity

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build monorepo
        run: npm run build

      - name: Validate generated lock metadata
        run: |
          npm run check:shrinkwrap
          npm run check:install-lock:coding-agent

      - name: Inspect publish tarball
        working-directory: packages/coding-agent
        run: npm pack --dry-run --ignore-scripts

      - name: Remove one-off validation workflow
        run: |
          rm .github/workflows/validate-npm-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-npm-package.yml
          git commit -m "ci: complete npm package validation"
          git push
