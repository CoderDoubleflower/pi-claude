name: Diagnose npm package validation

on:
  push:
    branches:
      - chore/npm-package-identity

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Run validation and capture report
        shell: bash
        run: |
          set +e
          mkdir -p .ai-bridge

          npm ci --ignore-scripts > /tmp/npm-ci.log 2>&1
          CI_CODE=$?

          if [ "$CI_CODE" -eq 0 ]; then
            npm run build > /tmp/build.log 2>&1
            BUILD_CODE=$?
          else
            BUILD_CODE=99
            echo "Skipped because npm ci failed." > /tmp/build.log
          fi

          if [ "$CI_CODE" -eq 0 ]; then
            npm run check:shrinkwrap > /tmp/shrinkwrap.log 2>&1
            SHRINKWRAP_CODE=$?
            npm run check:install-lock:coding-agent > /tmp/install-lock.log 2>&1
            INSTALL_LOCK_CODE=$?
          else
            SHRINKWRAP_CODE=99
            INSTALL_LOCK_CODE=99
            echo "Skipped because npm ci failed." > /tmp/shrinkwrap.log
            echo "Skipped because npm ci failed." > /tmp/install-lock.log
          fi

          if [ "$CI_CODE" -eq 0 ] && [ "$BUILD_CODE" -eq 0 ]; then
            (cd packages/coding-agent && npm pack --dry-run --ignore-scripts) > /tmp/pack.log 2>&1
            PACK_CODE=$?
          else
            PACK_CODE=99
            echo "Skipped because install or build failed." > /tmp/pack.log
          fi

          {
            echo "# npm package validation"
            echo
            echo "- npm ci: $CI_CODE"
            echo "- build: $BUILD_CODE"
            echo "- shrinkwrap check: $SHRINKWRAP_CODE"
            echo "- install-lock check: $INSTALL_LOCK_CODE"
            echo "- npm pack dry run: $PACK_CODE"
            echo
            for item in "npm-ci:/tmp/npm-ci.log" "build:/tmp/build.log" "shrinkwrap:/tmp/shrinkwrap.log" "install-lock:/tmp/install-lock.log" "pack:/tmp/pack.log"; do
              name="${item%%:*}"
              path="${item#*:}"
              echo "## $name"
              echo '```text'
              tail -n 120 "$path"
              echo '```'
              echo
            done
          } > .ai-bridge/npm-package-validation.md

      - name: Commit report and remove workflow
        run: |
          rm .github/workflows/validate-npm-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai-bridge/npm-package-validation.md .github/workflows/validate-npm-package.yml
          git commit -m "ci: record npm package validation"
          git push
