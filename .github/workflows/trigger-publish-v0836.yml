name: Trigger pi-claude v0.83.6 publish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-publish-v0836.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch tested patch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run -R CoderDoubleflower/pi-claude publish-npm.yml --ref main -f retry_current=false -f bump=patch
