name: Apply plan-mode readonly fix

on:
  push:
    branches:
      - fix/plan-mode-readonly-capabilities
    paths:
      - scripts/apply-plan-mode-readonly-fix.py
      - scripts/plan-mode-shell-policy.ts.tmp
      - .github/workflows/apply-plan-mode-readonly-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plan-mode-readonly-capabilities
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: python3 scripts/apply-plan-mode-readonly-fix.py
      - run: npx biome check --write packages/coding-agent/src/extensions/plan-mode/index.ts packages/coding-agent/src/extensions/plan-mode/shell-policy.ts packages/coding-agent/test/plan-mode.test.ts
      - run: npm --prefix packages/coding-agent test -- test/plan-mode.test.ts
      - run: npm --prefix packages/coding-agent run build

      - name: Commit verified fix
        run: |
          rm -f scripts/apply-plan-mode-readonly-fix.py
          rm -f scripts/plan-mode-shell-policy.ts.tmp
          rm -f .github/workflows/apply-plan-mode-readonly-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(coding-agent): relax plan-mode read-only exploration"
          git push origin HEAD:fix/plan-mode-readonly-capabilities
