name: Trigger plan clear-context session validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/plan-clear-context-session
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Extract and apply the prepared patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/patch-plan-clear-context-session.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-plan-clear-context.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/apply-plan-clear-context.py
          git rm .github/workflows/patch-plan-clear-context-session.yml

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run focused tests
        run: npx vitest --run packages/coding-agent/test/plan-mode.test.ts packages/coding-agent/test/plan-mode-shortcut.test.ts

      - name: Commit validated feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src/core/extensions/types.ts \
                  packages/coding-agent/src/core/extensions/runner.ts \
                  packages/coding-agent/src/extensions/plan-mode/index.ts \
                  packages/coding-agent/test/plan-mode.test.ts
          git commit -m "feat(coding-agent): execute approved plans in a fresh context"
          git push origin HEAD:feat/plan-clear-context-session

      - name: Remove trigger workflow from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/trigger-plan-clear-context-session.yml ]; then
            git rm .github/workflows/trigger-plan-clear-context-session.yml
            git commit -m "chore: remove plan clear-context validation trigger"
            git push origin main
          fi
