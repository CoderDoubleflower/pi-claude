name: Scan old package references

on:
  push:
    branches:
      - chore/npm-package-identity

permissions:
  contents: write

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record references
        shell: bash
        run: |
          mkdir -p .ai-bridge
          {
            echo '# References to @earendil-works/pi-coding-agent'
            echo
            echo '```text'
            git grep -n '@earendil-works/pi-coding-agent' -- ':!.ai-bridge/*' || true
            echo '```'
          } > .ai-bridge/old-package-references.md

      - name: Commit report and remove workflow
        run: |
          rm .github/workflows/scan-old-package-references.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai-bridge/old-package-references.md .github/workflows/scan-old-package-references.yml
          git commit -m "ci: record old npm package references"
          git push
