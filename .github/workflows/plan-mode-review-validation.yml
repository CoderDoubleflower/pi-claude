name: Plan mode review validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check plan mode formatting
        run: >-
          npx biome check
          packages/coding-agent/src/extensions/plan-mode
          packages/coding-agent/src/extensions/index.ts
          packages/coding-agent/test/plan-mode.test.ts

      - name: Run plan mode tests
        run: npx vitest --run packages/coding-agent/test/plan-mode.test.ts
