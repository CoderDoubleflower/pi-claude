name: Plan mode review validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format and check plan mode
        run: >-
          npx biome check --write
          packages/coding-agent/src/extensions/plan-mode
          packages/coding-agent/src/extensions/index.ts
          packages/coding-agent/test/plan-mode.test.ts

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src/extensions/plan-mode packages/coding-agent/src/extensions/index.ts packages/coding-agent/test/plan-mode.test.ts
          git commit -m "style(plan-mode): apply Biome formatting"
          git push

      - name: Run plan mode tests
        run: npx vitest --run packages/coding-agent/test/plan-mode.test.ts
