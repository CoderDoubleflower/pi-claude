name: One-off Claude status fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.title == 'Trigger Claude status fix'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/claude-completion-status
          fetch-depth: 0

      - name: Check whether patch is still pending
        id: patch
        shell: bash
        run: |
          if [[ -f .github/scripts/apply-claude-status-fix.mjs ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.patch.outputs.run == 'true'
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install system dependencies
        if: steps.patch.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        if: steps.patch.outputs.run == 'true'
        run: npm ci --ignore-scripts

      - name: Apply exact source patch
        if: steps.patch.outputs.run == 'true'
        run: node .github/scripts/apply-claude-status-fix.mjs

      - name: Complete focused test fixture
        if: steps.patch.outputs.run == 'true'
        run: node .github/scripts/fix-claude-status-test.mjs

      - name: Format changed files
        if: steps.patch.outputs.run == 'true'
        run: >-
          npx biome check --write --error-on-warnings
          packages/coding-agent/src/modes/interactive/components/claude-working.ts
          packages/coding-agent/src/modes/interactive/components/custom-editor.ts
          packages/coding-agent/src/modes/interactive/components/status-indicator.ts
          packages/coding-agent/src/modes/interactive/interactive-mode.ts
          packages/coding-agent/test/claude-status.test.ts

      - name: Build
        if: steps.patch.outputs.run == 'true'
        run: npm run build

      - name: Check
        if: steps.patch.outputs.run == 'true'
        run: npm run check

      - name: Run focused tests
        if: steps.patch.outputs.run == 'true'
        run: npx vitest --run packages/coding-agent/test/claude-status.test.ts

      - name: Commit verified changes
        if: steps.patch.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(coding-agent): preserve Claude completion status"
          git push origin HEAD:fix/claude-completion-status
