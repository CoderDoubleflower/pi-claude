name: One-off Claude status fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.title == 'Trigger Claude status fix'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/claude-completion-status
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Apply exact source patch
        run: node .github/scripts/apply-claude-status-fix.mjs

      - name: Format and lint changed files
        run: >-
          npx biome check --write --error-on-warnings
          packages/coding-agent/src/modes/interactive/components/claude-working.ts
          packages/coding-agent/src/modes/interactive/components/custom-editor.ts
          packages/coding-agent/src/modes/interactive/components/status-indicator.ts
          packages/coding-agent/src/modes/interactive/interactive-mode.ts
          packages/coding-agent/test/claude-status.test.ts

      - name: Typecheck
        run: npx tsgo --noEmit

      - name: Run focused tests
        run: npx vitest --run packages/coding-agent/test/claude-status.test.ts

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(coding-agent): preserve Claude completion status"
          git push origin HEAD:fix/claude-completion-status
