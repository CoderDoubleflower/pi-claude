name: One-time npm publish retry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-publish.yml

permissions:
  actions: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Dispatch patch release
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run publish-npm.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f retry_current=false \
            -f bump=patch

          run_id=''
          for _ in $(seq 1 30); do
            run_id="$(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-npm.yml \
                --event workflow_dispatch --limit 10 \
                --json databaseId,createdAt,headBranch \
              | jq -r --arg started "$started_at" \
                '[.[] | select(.createdAt >= $started and .headBranch == "main")] | sort_by(.createdAt) | last | .databaseId // empty'
            )"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            echo 'Unable to locate the dispatched publish run.' >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for publish result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Remove one-time workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          path='.github/workflows/one-time-publish.yml'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message='chore: remove one-time publish workflow' \
              -f sha="$sha" \
              -f branch=main
          fi
