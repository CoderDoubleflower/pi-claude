name: Dispatch current pi-claude publish once

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.head_commit.message == 'chore: dispatch pi-claude v0.83.13 publish'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch publish-npm.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${REPOSITORY}/actions/workflows/publish-npm.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main","inputs":{"retry_current":"true","bump":"patch","version":""}}'
