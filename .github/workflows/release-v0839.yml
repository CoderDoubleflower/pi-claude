name: Release pi-claude v0.83.9

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0839.yml

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch tested patch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run -R CoderDoubleflower/pi-claude publish-npm.yml --ref main -f retry_current=false -f bump=patch

      - name: Wait for publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          run_id=""
          for _ in $(seq 1 60); do
            run_id=$(gh run list -R CoderDoubleflower/pi-claude --workflow publish-npm.yml --event workflow_dispatch --limit 20 --json databaseId,headSha --jq '.[] | select(.headSha == env.TARGET_SHA) | .databaseId' | head -n 1)
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "No publish-npm run found for $TARGET_SHA" >&2
            exit 1
          fi
          echo "Monitoring publish workflow run $run_id"
          gh run watch -R CoderDoubleflower/pi-claude "$run_id" --exit-status

      - name: Remove temporary release workflow
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit cleanup
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v0839.yml
          git commit -m "chore: remove v0.83.9 release workflow"
          git push origin HEAD:main
