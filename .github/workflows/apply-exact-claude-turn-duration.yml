name: Apply exact Claude turn duration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.title == 'Trigger exact Claude turn duration'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/exact-claude-turn-duration
          fetch-depth: 0

      - name: Check whether patch is pending
        id: patch
        shell: bash
        run: |
          if [[ -f .github/scripts/apply-exact-claude-turn-duration.mjs ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.patch.outputs.run == 'true'
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install system dependencies
        if: steps.patch.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        if: steps.patch.outputs.run == 'true'
        run: npm ci --ignore-scripts

      - name: Repair staged patch script
        if: steps.patch.outputs.run == 'true' && hashFiles('.github/scripts/repair-exact-claude-turn-duration.mjs') != ''
        run: node .github/scripts/repair-exact-claude-turn-duration.mjs

      - name: Apply exact source patch
        if: steps.patch.outputs.run == 'true'
        run: node .github/scripts/apply-exact-claude-turn-duration.mjs

      - name: Format intended files
        if: steps.patch.outputs.run == 'true'
        run: >-
          npx biome check --write --error-on-warnings
          packages/coding-agent/src/modes/interactive/components/claude-turn-duration.ts
          packages/coding-agent/src/modes/interactive/components/claude-working.ts
          packages/coding-agent/src/modes/interactive/components/status-indicator.ts
          packages/coding-agent/src/modes/interactive/interactive-mode.ts
          packages/coding-agent/test/claude-status.test.ts

      - name: Build
        if: steps.patch.outputs.run == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.patch.outputs.run == 'true'
        run: npx tsgo --noEmit

      - name: Run focused tests
        if: steps.patch.outputs.run == 'true'
        run: npx vitest --run packages/coding-agent/test/claude-status.test.ts

      - name: Validate diff scope
        if: steps.patch.outputs.run == 'true'
        shell: bash
        run: |
          git add -A \
            .github/scripts/apply-exact-claude-turn-duration.mjs \
            .github/scripts/repair-exact-claude-turn-duration.mjs \
            packages/coding-agent/src/modes/interactive/components/claude-turn-duration.ts \
            packages/coding-agent/src/modes/interactive/components/claude-working.ts \
            packages/coding-agent/src/modes/interactive/components/status-indicator.ts \
            packages/coding-agent/src/modes/interactive/interactive-mode.ts \
            packages/coding-agent/test/claude-status.test.ts
          base="$(git merge-base HEAD origin/main)"
          actual="$(git diff --name-only "$base" | sort)"
          expected="$(printf '%s\n' \
            packages/coding-agent/src/modes/interactive/components/claude-turn-duration.ts \
            packages/coding-agent/src/modes/interactive/components/claude-working.ts \
            packages/coding-agent/src/modes/interactive/components/status-indicator.ts \
            packages/coding-agent/src/modes/interactive/interactive-mode.ts \
            packages/coding-agent/test/claude-status.test.ts | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected final branch diff:"
            printf '%s\n' "$actual"
            exit 1
          fi

      - name: Commit verified changes
        if: steps.patch.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(coding-agent): exactly match Claude turn duration UI"
          git push origin HEAD:fix/exact-claude-turn-duration
