name: Patch hidden plan and todo tool UI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/hide-plan-todo-tool-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check whether patch is pending
        id: gate
        run: |
          if test -f scripts/patch-hidden-plan-todo-tools.mjs; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.apply == 'true'
        run: npm ci --ignore-scripts

      - name: Apply implementation
        if: steps.gate.outputs.apply == 'true'
        run: node scripts/patch-hidden-plan-todo-tools.mjs

      - name: Check changed files
        if: steps.gate.outputs.apply == 'true'
        run: |
          npx --no-install biome check --write \
            packages/coding-agent/src/modes/interactive/components/tool-execution.ts \
            packages/coding-agent/test/tool-execution-spacing.test.ts
          git diff --check

      - name: Run focused regression tests
        if: steps.gate.outputs.apply == 'true'
        working-directory: packages/coding-agent
        run: node ../../node_modules/vitest/dist/cli.js --run test/tool-execution-spacing.test.ts

      - name: Build workspace
        if: steps.gate.outputs.apply == 'true'
        run: npm run build

      - name: Commit implementation
        if: steps.gate.outputs.apply == 'true'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch-hidden-plan-todo-tools.mjs
          git add packages/coding-agent/src/modes/interactive/components/tool-execution.ts
          git add packages/coding-agent/test/tool-execution-spacing.test.ts
          git commit -m "fix(coding-agent): hide plan and todo tool calls"
          git push origin "HEAD:${HEAD_BRANCH}"
