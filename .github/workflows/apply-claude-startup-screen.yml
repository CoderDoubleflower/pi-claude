name: Apply Claude startup screen

on:
  push:
    branches:
      - feat/claude-startup-screen
    paths:
      - .github/workflows/apply-claude-startup-screen.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/claude-startup-screen
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch interactive startup header
        shell: python
        run: |
          from pathlib import Path

          path = Path("packages/coding-agent/src/modes/interactive/interactive-mode.ts")
          source = path.read_text()

          working_import = 'import { shouldShowClaudeTurnDuration } from "./components/claude-working.ts";\n'
          startup_import = 'import { ClaudeStartupComponent } from "./components/claude-startup.ts";\n'
          if startup_import not in source:
              if working_import not in source:
                  raise SystemExit("Could not locate claude-working import")
              source = source.replace(working_import, working_import + startup_import, 1)

          old_keybinding_import = (
              'import { formatKeyText, keyDisplayText, keyHint, keyText, rawKeyHint } '
              'from "./components/keybinding-hints.ts";'
          )
          new_keybinding_import = (
              'import { formatKeyText, keyDisplayText } '
              'from "./components/keybinding-hints.ts";'
          )
          if old_keybinding_import in source:
              source = source.replace(old_keybinding_import, new_keybinding_import, 1)

          start_marker = '\t\t// Add header with keybindings from config (unless silenced)\n'
          end_marker = '\t\t// Initialize extensions first so resources are shown before messages\n'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit("Could not locate startup header block")

          replacement = '''\t\t// Match Claude Code's normal condensed startup identity instead of printing\n\t\t// a multi-line keybinding/help transcript into the conversation.\n\t\tif (this.options.verbose || !this.settingsManager.getQuietStartup()) {\n\t\t\tthis.builtInHeader = new ClaudeStartupComponent(() => ({\n\t\t\t\tappName: APP_NAME,\n\t\t\t\tversion: this.version,\n\t\t\t\tmodel: this.session.model,\n\t\t\t\tthinkingLevel: this.session.thinkingLevel,\n\t\t\t\tcwd: this.sessionManager.getCwd(),\n\t\t\t}));\n\n\t\t\tthis.headerContainer.addChild(new Spacer(1));\n\t\t\tthis.headerContainer.addChild(this.builtInHeader);\n\t\t\tthis.headerContainer.addChild(new Spacer(1));\n\t\t} else {\n\t\t\t// Preserve quiet-startup behavior.\n\t\t\tthis.builtInHeader = new Text("", 0, 0);\n\t\t\tthis.headerContainer.addChild(this.builtInHeader);\n\t\t}\n\t\tthis.ui.requestRender();\n\n'''
          source = source[:start] + replacement + source[end:]
          path.write_text(source)

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-claude-startup-screen.yml

      - name: Check patch
        run: git diff --check

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build coding agent
        run: npm run build --workspace=@doubleflower/pi-claude

      - name: Test coding agent
        run: npm test --workspace=@doubleflower/pi-claude

      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src/modes/interactive/interactive-mode.ts \
                  packages/coding-agent/src/modes/interactive/components/claude-startup.ts \
                  .github/workflows/apply-claude-startup-screen.yml
          git commit -m "feat(coding-agent): match Claude Code startup screen"
          git push origin HEAD:feat/claude-startup-screen
