name: Apply packed runtime compatibility fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: apply-packed-runtime-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/packed-cli-runtime-compat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/packed-cli-runtime-compat
          fetch-depth: 0
          persist-credentials: true

      - name: Localize the unpublished pi-ai helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/coding-agent/src/core/agent-session.ts')
          text = path.read_text()

          imported = '\tisRecoverableLength,\n'
          if text.count(imported) != 1:
              raise SystemExit(f'expected one isRecoverableLength import, found {text.count(imported)}')
          text = text.replace(imported, '', 1)

          anchor = 'import { addUsageToTotals, createUsageTotals } from "./usage-totals.ts";\n'
          helper = '''\n/** Keep this helper inside the published CLI until the minimum pi-ai dependency exports it. */\nfunction isRecoverableLength(message: AssistantMessage, desiredMaxOutput: number): boolean {\n\treturn message.stopReason === "length" && desiredMaxOutput > 0 && message.usage.output < desiredMaxOutput;\n}\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one helper insertion anchor, found {text.count(anchor)}')
          text = text.replace(anchor, anchor + helper, 1)
          path.write_text(text)
          PY

          rm .github/workflows/apply-packed-runtime-fix.yml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src/core/agent-session.ts .github/workflows/apply-packed-runtime-fix.yml
          git commit -m "fix: keep recoverable length detection in published CLI"
          git push origin HEAD:fix/packed-cli-runtime-compat
