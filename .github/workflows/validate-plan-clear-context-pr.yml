name: Validate clean plan approval fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/plan-clear-context-no-extra-turn
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed files
        run: |
          npx biome check --write \
            packages/coding-agent/src/extensions/plan-mode/index.ts \
            packages/coding-agent/test/plan-mode-clear-context-termination.test.ts

      - name: Run focused tests
        run: |
          npx vitest --run \
            packages/coding-agent/test/plan-mode-clear-context-termination.test.ts \
            packages/coding-agent/test/plan-mode.test.ts \
            packages/coding-agent/test/plan-mode-shortcut.test.ts

      - name: Build monorepo
        run: npm run build

      - name: Commit formatter output and remove validator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-plan-clear-context-pr.yml
          git add packages/coding-agent/src/extensions/plan-mode/index.ts \
                  packages/coding-agent/test/plan-mode-clear-context-termination.test.ts
          git commit -m "style(coding-agent): format clean plan approval fix"
          git push origin HEAD:fix/plan-clear-context-no-extra-turn
