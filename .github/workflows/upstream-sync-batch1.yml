name: Integrate upstream batch 1

on:
  push:
    branches:
      - sync/upstream-batch1-20260805

permissions:
  contents: write

concurrency:
  group: upstream-sync-batch1
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-batch1-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Cherry-pick reviewed upstream fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git log -1 --pretty=%B | grep -q "finish upstream batch 1 integration"; then
            echo "Batch already integrated."
            exit 0
          fi

          git remote add upstream https://github.com/earendil-works/pi.git 2>/dev/null || true
          git fetch upstream main --no-tags

          sync_base="4c01c709380621c5ff2719162cd7a7973dcb2799"
          selected="
          b9d360a2c753e058a90dc0a252950631501c10d0
          cbaca60389f5d7097a43c95f56a19d344ecf2195
          d93e7e88fae51e698efd2921ccb38aa26f592470
          816237c101645954d2a0ecf4bb9360a9cc71ddf1
          2e95584dab802ae2f7c8d1a4994d6e0e9f67ec09
          b04faa2dae8d06b31208ace84ca4d8911c2d3c27
          b0e05b442305067b0021238a6e2f217c1bf65416
          a24fb9e96a3fbc7be2a87e81aa1aa5c0ddf95d35
          0e633790c5a007f6d4bf35ba67ced457287c25ac
          da66636cc4e607bf7f05d9cb64bf6963b10a007d
          523b5a4917ea46c20fb7b24a41311b158b7eeb05
          25a2c8dcfec4e017720c163a6166200a9bef98ae
          b06dc76fd7b17d890403386cc5147ae5ea9f68ac
          0f5286d8ab86942d12c85a9df2893c98c1157405
          e8a17822de1076c3048701118a8a5f25c1e98565
          "

          mapfile -t ordered < <(git rev-list --reverse "${sync_base}..upstream/main")
          for sha in "${ordered[@]}"; do
            if ! grep -qxF "$sha" <<<"$(printf '%s\n' $selected)"; then
              continue
            fi
            if git merge-base --is-ancestor "$sha" HEAD; then
              echo "Already present: $sha"
              continue
            fi
            echo "Cherry-picking $sha"
            parent_fields=$(git rev-list --parents -n 1 "$sha" | awk '{print NF}')
            if [ "$parent_fields" -gt 2 ]; then
              git cherry-pick -m 1 "$sha"
            else
              git cherry-pick "$sha"
            fi
          done

      - name: Remove one-shot workflow and push
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/upstream-sync-batch1.yml
          git add -A
          git commit -m "chore: finish upstream batch 1 integration"
          git push origin HEAD:sync/upstream-batch1-20260805
