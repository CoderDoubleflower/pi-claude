name: Diagnose npm publish workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Reproduce release preparation
        id: diagnose
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/pi-claude-diagnose

          run_step() {
            name="$1"
            shift
            echo "## $name" >> /tmp/pi-claude-diagnose/report.md
            echo '```text' >> /tmp/pi-claude-diagnose/report.md
            "$@" >"/tmp/pi-claude-diagnose/${name}.log" 2>&1
            status=$?
            tail -n 120 "/tmp/pi-claude-diagnose/${name}.log" >> /tmp/pi-claude-diagnose/report.md
            echo '```' >> /tmp/pi-claude-diagnose/report.md
            echo "Exit code: $status" >> /tmp/pi-claude-diagnose/report.md
            echo >> /tmp/pi-claude-diagnose/report.md
            if [ "$status" -ne 0 ]; then
              echo "FAILED_STEP=$name" >> "$GITHUB_ENV"
              return "$status"
            fi
          }

          echo '# npm publish diagnostic' > /tmp/pi-claude-diagnose/report.md
          echo >> /tmp/pi-claude-diagnose/report.md
          echo "Commit: $GITHUB_SHA" >> /tmp/pi-claude-diagnose/report.md
          echo >> /tmp/pi-claude-diagnose/report.md

          run_step npm-latest npm install --global npm@latest || exit 0
          run_step prepare node scripts/prepare-pi-claude-release.mjs patch || exit 0
          run_step refresh-lock npm install --package-lock-only --ignore-scripts || exit 0
          run_step shrinkwrap node scripts/generate-coding-agent-shrinkwrap.mjs || exit 0
          run_step install-lock node scripts/generate-coding-agent-install-lock.mjs || exit 0
          run_step npm-ci npm ci --ignore-scripts || exit 0
          run_step build npm run build:offline || exit 0
          run_step tests npm test --workspace=@doubleflower/pi-claude || exit 0
          run_step check-shrinkwrap npm run check:shrinkwrap || exit 0
          run_step check-install-lock npm run check:install-lock:coding-agent || exit 0
          run_step pack npm pack --dry-run --ignore-scripts --workspace=@doubleflower/pi-claude || exit 0

          echo 'All pre-publish steps succeeded.' >> /tmp/pi-claude-diagnose/report.md

      - name: Commit diagnostic report and remove workflow
        if: always()
        shell: bash
        run: |
          cp /tmp/pi-claude-diagnose/report.md /tmp/npm-publish-diagnostic.md
          git reset --hard HEAD
          git clean -fd
          mkdir -p .ai-bridge
          cp /tmp/npm-publish-diagnostic.md .ai-bridge/npm-publish-diagnostic.md
          rm -f .github/workflows/diagnose-npm-publish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ai-bridge/npm-publish-diagnostic.md .github/workflows/diagnose-npm-publish.yml
          git commit -m "chore: record npm publish diagnostic"
          git push origin HEAD:main
