name: Plan mode targeted validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/claude-plan-mode
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Preserve normal tools across branch navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("packages/coding-agent/src/extensions/plan-mode/index.ts")
          source = path.read_text()

          source, count = re.subn(
              r'(export default function planModeExtension\(pi: ExtensionAPI\): void \{\n\s*let state: PlanModeState = createDefaultPlanModeState\(\);)',
              r'\1\n\tlet lastNormalTools: string[] | undefined;',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to insert normal tool snapshot")

          source, count = re.subn(
              r'\tfunction restoreNormalTools\(savedTools = state\.toolsBeforePlan\): void \{\n\s*pi\.setActiveTools\(getRestoredTools\(savedTools, pi\.getActiveTools\(\), availableToolNames\(\)\)\);\n\s*\}',
              '\tfunction restoreNormalTools(savedTools = state.toolsBeforePlan ?? lastNormalTools): void {\n'
              '\t\tconst restoredTools = getRestoredTools(savedTools, pi.getActiveTools(), availableToolNames());\n'
              '\t\tpi.setActiveTools(restoredTools);\n'
              '\t\tlastNormalTools = restoredTools;\n'
              '\t}',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to replace normal tool restoration")

          source, count = re.subn(
              r'(\t\tconst toolsBeforePlan = pi\.getActiveTools\(\);)',
              r'\1\n\t\tlastNormalTools = [...toolsBeforePlan];',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to snapshot tools on plan entry")

          source, count = re.subn(
              r'(\tasync function restoreSession\([\s\S]*?\): Promise<void> \{\n)\s*state = findLatestPlanModeState\(ctx\.sessionManager\.getBranch\(\)\) \?\? createDefaultPlanModeState\(\);',
              r'\1\t\tconst previousNormalTools =\n'
              r'\t\t\tstate.phase === "inactive" ? pi.getActiveTools() : (state.toolsBeforePlan ?? lastNormalTools);\n'
              r'\t\tstate = findLatestPlanModeState(ctx.sessionManager.getBranch()) ?? createDefaultPlanModeState();\n'
              r'\t\tif (state.toolsBeforePlan) lastNormalTools = [...state.toolsBeforePlan];\n'
              r'\t\telse if (previousNormalTools) lastNormalTools = [...previousNormalTools];',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to preserve tools during session restoration")

          path.write_text(source)
          PY

      - name: Format plan mode files
        run: >-
          npx biome check --write
          packages/coding-agent/src/extensions/plan-mode
          packages/coding-agent/src/extensions/index.ts
          packages/coding-agent/test/plan-mode.test.ts

      - name: Run plan mode tests
        run: npx vitest --run packages/coding-agent/test/plan-mode.test.ts

      - name: Commit validated changes and remove workflow
        run: |
          rm .github/workflows/plan-mode-targeted.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src/extensions/plan-mode packages/coding-agent/src/extensions/index.ts packages/coding-agent/test/plan-mode.test.ts .github/workflows/plan-mode-targeted.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(plan-mode): preserve tools across branch navigation"
            git push origin HEAD:feat/claude-plan-mode
          fi
