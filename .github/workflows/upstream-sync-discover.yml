# Trigger semantic merge run (attempt 2).
# This temporary workflow is removed by the resolver.
name: Discover upstream merge conflicts

on:
  push:
    branches:
      - automation/upstream-sync-20260803
    paths:
      - .github/workflows/upstream-sync-discover.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/upstream-sync-20260803

      - name: Discover merge conflicts
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/earendil-works/pi.git
          git fetch upstream main

          base_sha=$(git merge-base HEAD upstream/main)
          local_sha=$(git rev-parse HEAD)
          upstream_sha=$(git rev-parse upstream/main)

          set +e
          git merge --no-commit --no-ff upstream/main
          merge_status=$?
          set -e

          {
            echo "base=$base_sha"
            echo "local=$local_sha"
            echo "upstream=$upstream_sha"
            echo "merge_status=$merge_status"
          } > .upstream-sync-status.txt

          if [ "$merge_status" -ne 0 ]; then
            git diff --name-only --diff-filter=U | sort > /tmp/conflicts.txt
            {
              echo "# Upstream merge conflicts"
              echo
              echo "Generated by GitHub Actions while merging earendil-works/pi main into pi-claude."
              echo
              echo '```text'
              cat /tmp/conflicts.txt
              echo '```'
              echo
              echo "## Index stages"
              echo
              echo '```text'
              git ls-files -u
              echo '```'
            } > .upstream-sync-conflicts.md
            git merge --abort
          else
            echo "# Upstream merge conflicts" > .upstream-sync-conflicts.md
            echo >> .upstream-sync-conflicts.md
            echo "No textual conflicts." >> .upstream-sync-conflicts.md
            git commit -m "Merge upstream earendil-works/pi"
          fi

          git add .upstream-sync-status.txt .upstream-sync-conflicts.md
          git commit -m "chore: record upstream merge analysis" || true
          git push origin HEAD:automation/upstream-sync-20260803
