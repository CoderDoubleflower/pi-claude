name: Retrigger pi-claude npm publish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retrigger-publish.yml

permissions:
  actions: write
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove one-time trigger
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/retrigger-publish.yml
          git commit -m "chore: remove one-time publish trigger"
          git push origin HEAD:main

      - name: Dispatch publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh workflow run publish-npm.yml \
            --ref main \
            -f retry_current=false \
            -f bump=patch
