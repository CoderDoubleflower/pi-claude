name: Fix PR 37 terminal image regression

on:
  push:
    branches:
      - fix/uniform-tool-message-spacing
    paths:
      - .github/workflows/fix-pr37-terminal-image.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/uniform-tool-message-spacing
          fetch-depth: 0

      - name: Preserve terminal-image-only output and add regression coverage
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          source_path = Path("packages/coding-agent/src/modes/interactive/components/tool-execution.ts")
          source = source_path.read_text()
          old_source = 'const firstContentLine = lines.findIndex((line) => stripAnsi(line).trim().length > 0);'
          new_source = '''const firstContentLine = lines.findIndex(
          \t\t\t(line) => isTerminalImageSequence(line) || stripAnsi(line).trim().length > 0,
          \t\t);'''
          if old_source not in source:
              raise SystemExit("Expected tool-execution render expression was not found")
          source_path.write_text(source.replace(old_source, new_source, 1))

          test_path = Path("packages/coding-agent/test/tool-execution-spacing.test.ts")
          test = test_path.read_text()
          old_import = 'import type { TUI } from "@earendil-works/pi-tui";'
          new_import = 'import { Text, type TUI } from "@earendil-works/pi-tui";\nimport type { ToolDefinition } from "../src/core/extensions/types.ts";'
          if old_import not in test:
              raise SystemExit("Expected test import was not found")
          test = test.replace(old_import, new_import, 1)

          closing = "\n});\n"
          if not test.endswith(closing):
              raise SystemExit("Unexpected test file ending")
          regression = r'''

          	it("preserves terminal-image-only renderer output", () => {
          		const imageSequence = "\x1b]1337;File=name=test.png;inline=1:AAAA\x07";
          		const definition = {
          			renderShell: "self",
          			renderCall: () => new Text(imageSequence, 0, 0),
          		} as unknown as ToolDefinition<any, any>;

          		const component = new ToolExecutionComponent(
          			"ImageOnly",
          			"image-only",
          			{},
          			{ showImages: false },
          			definition,
          			ui,
          			process.cwd(),
          		);

          		const lines = component.render(120);
          		expect(lines.some((line) => line.includes(imageSequence))).toBe(true);
          		expect(lines.map(stripAnsi).join("\n")).toContain("ImageOnly");
          	});'''
          test_path.write_text(test[:-len(closing)] + regression + closing)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src/modes/interactive/components/tool-execution.ts packages/coding-agent/test/tool-execution-spacing.test.ts
          git commit -m "fix(coding-agent): preserve terminal image rendering"
          git push origin HEAD:fix/uniform-tool-message-spacing
