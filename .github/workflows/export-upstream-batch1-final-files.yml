name: Export validated upstream batch 1 files

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-batch1-20260805
      - shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          replacements = {
              Path("packages/ai/test/context-overflow.test.ts"): [
                  ("gemini-2.5-pro - should detect overflow via isContextOverflow", "gemini-3.1-pro-preview - should detect overflow via isContextOverflow"),
                  ('getModel("github-copilot", "gemini-2.5-pro")', 'getModel("github-copilot", "gemini-3.1-pro-preview")'),
              ],
              Path("packages/ai/test/openai-completions-tool-choice.test.ts"): [
                  ('getModel("groq", "qwen/qwen3-32b")', 'getModel("groq", "qwen/qwen3.6-27b")'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f"Unexpected occurrence count for {old!r} in {path}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          mkdir -p /tmp/batch1-files/packages/ai/test
          cp packages/ai/test/context-overflow.test.ts /tmp/batch1-files/packages/ai/test/
          cp packages/ai/test/openai-completions-tool-choice.test.ts /tmp/batch1-files/packages/ai/test/
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-batch1-final-files
          path: /tmp/batch1-files
          if-no-files-found: error
