name: Inspect upstream sync 2026-07-31

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    if: github.event.pull_request.title == 'chore: sync upstream Pi through 74caa26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect and report three-way merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/earendil-works/pi.git
          git fetch upstream main

          set +e
          git merge --no-commit --no-ff upstream/main >/tmp/upstream-merge.log 2>&1
          merge_status=$?
          set -e

          upstream_head="$(git rev-parse upstream/main)"
          base_head="$(git rev-parse HEAD)"
          conflicts="$(git diff --name-only --diff-filter=U || true)"

          {
            echo '<!-- upstream-sync-inspection-20260731 -->'
            echo '## Upstream merge inspection'
            echo
            echo "- Base: \`${base_head}\`"
            echo "- Upstream: \`${upstream_head}\`"
            echo "- Merge status: \`${merge_status}\`"
            echo
            if [ -n "${conflicts}" ]; then
              echo '### Conflict files'
              echo '```text'
              printf '%s\n' "${conflicts}"
              echo '```'
            else
              echo 'No textual merge conflicts detected.'
            fi
            echo
            echo '<details><summary>git merge output</summary>'
            echo
            echo '```text'
            cat /tmp/upstream-merge.log
            echo '```'
            echo '</details>'
          } >/tmp/upstream-report.md

          existing_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select(.body | contains("upstream-sync-inspection-20260731")) | .id' | head -n1)"
          if [ -n "${existing_id}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -F body=@/tmp/upstream-report.md
          else
            gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/upstream-report.md
          fi
