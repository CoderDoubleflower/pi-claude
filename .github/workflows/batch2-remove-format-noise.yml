name: Remove Batch 2 Formatting Noise

on:
  push:
    branches:
      - sync/upstream-batch2-20260805

permissions:
  contents: write

concurrency:
  group: batch2-remove-format-noise
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-batch2-20260805
          fetch-depth: 0

      - name: Restore files changed only by validator formatting
        shell: bash
        run: |
          set -euo pipefail
          git checkout bd94749610903b591f50908e0ce5325ec91e6792 -- \
            packages/coding-agent/examples/extensions/custom-compaction.ts \
            packages/coding-agent/examples/extensions/handoff.ts \
            packages/coding-agent/examples/extensions/qna.ts \
            packages/coding-agent/src/cli.ts \
            packages/coding-agent/src/modes/interactive/components/claude-startup-compat.ts \
            packages/coding-agent/src/modes/interactive/components/claude-startup.ts \
            packages/coding-agent/src/rpc-entry.ts \
            packages/coding-agent/test/claude-startup.test.ts \
            packages/coding-agent/test/custom-editor-menu.test.ts \
            packages/coding-agent/test/plan-mode-session-handoff.test.ts \
            packages/coding-agent/test/plan-mode-shortcut.test.ts \
            packages/coding-agent/test/tool-activity-group.test.ts \
            packages/tui/test/select-list.test.ts
          rm .github/workflows/batch2-remove-format-noise.yml

      - name: Commit clean diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove validator formatting noise"
          git push origin HEAD:sync/upstream-batch2-20260805
