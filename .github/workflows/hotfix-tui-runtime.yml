name: Apply TUI runtime compatibility hotfix

on:
  push:
    branches:
      - hotfix/npm-tui-runtime-compat

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/npm-tui-runtime-compat
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file.write_text(content.replace(old, new, 1))

          Path("packages/coding-agent/src/utils/tui-runtime.ts").write_text('''import * as tuiRuntime from "@earendil-works/pi-tui";
          import type { Terminal, TUI } from "@earendil-works/pi-tui";

          type MainScreenConstructor = new (
          \tterminal: Terminal,
          \tshowHardwareCursor?: boolean,
          \tlogDirectory?: string,
          ) => TUI;

          interface AltScreenOptions {
          \topenUrl?: (url: string) => void;
          }

          type AltScreenConstructor = new (
          \tterminal: Terminal,
          \tshowHardwareCursor?: boolean,
          \tlogDirectory?: string,
          \toptions?: AltScreenOptions,
          ) => TUI;

          interface CompatibleTuiRuntime {
          \tTUI?: MainScreenConstructor;
          \tTuiMainScreen?: MainScreenConstructor;
          \tTuiAltScreen?: AltScreenConstructor;
          }

          const compatibleRuntime = tuiRuntime as unknown as CompatibleTuiRuntime;
          let warnedAboutAltScreenFallback = false;

          function getMainScreenConstructor(): MainScreenConstructor {
          \tconst Constructor = compatibleRuntime.TuiMainScreen ?? compatibleRuntime.TUI;
          \tif (!Constructor) {
          \t\tthrow new Error(
          \t\t\t"The installed @earendil-works/pi-tui package does not expose a compatible main-screen TUI constructor.",
          \t\t);
          \t}
          \treturn Constructor;
          }

          export function createMainScreenTui(
          \tterminal: Terminal,
          \tshowHardwareCursor?: boolean,
          \tlogDirectory?: string,
          ): TUI {
          \tconst Constructor = getMainScreenConstructor();
          \treturn new Constructor(terminal, showHardwareCursor, logDirectory);
          }

          export function createAltScreenTui(
          \tterminal: Terminal,
          \tshowHardwareCursor?: boolean,
          \tlogDirectory?: string,
          \toptions: AltScreenOptions = {},
          ): TUI {
          \tconst Constructor = compatibleRuntime.TuiAltScreen;
          \tif (Constructor) {
          \t\treturn new Constructor(terminal, showHardwareCursor, logDirectory, options);
          \t}

          \tif (!warnedAboutAltScreenFallback) {
          \t\twarnedAboutAltScreenFallback = true;
          \t\tprocess.emitWarning(
          \t\t\t"The installed @earendil-works/pi-tui version does not support alternate-screen mode; falling back to the main-screen renderer.",
          \t\t\t{ code: "PI_TUI_ALT_SCREEN_UNAVAILABLE" },
          \t\t);
          \t}

          \treturn createMainScreenTui(terminal, showHardwareCursor, logDirectory);
          }
          '''.replace("          ", ""))

          replace_once(
              "packages/coding-agent/src/cli/startup-ui.ts",
              'import { ProcessTerminal, setKeybindings, type TUI, TuiMainScreen } from "@earendil-works/pi-tui";',
              'import { ProcessTerminal, setKeybindings, type TUI } from "@earendil-works/pi-tui";',
          )
          replace_once(
              "packages/coding-agent/src/cli/startup-ui.ts",
              'import { SettingsManager } from "../core/settings-manager.ts";',
              'import { SettingsManager } from "../core/settings-manager.ts";\nimport { createMainScreenTui } from "../utils/tui-runtime.ts";',
          )
          replace_once(
              "packages/coding-agent/src/cli/startup-ui.ts",
              'const ui: TUI = new TuiMainScreen(new ProcessTerminal(), settingsManager.getShowHardwareCursor(), getAgentDir());',
              'const ui: TUI = createMainScreenTui(\n\t\tnew ProcessTerminal(),\n\t\tsettingsManager.getShowHardwareCursor(),\n\t\tgetAgentDir(),\n\t);',
          )

          replace_once(
              "packages/coding-agent/src/cli/config-selector.ts",
              'import { ProcessTerminal, type TUI, TuiMainScreen } from "@earendil-works/pi-tui";',
              'import { ProcessTerminal, type TUI } from "@earendil-works/pi-tui";',
          )
          replace_once(
              "packages/coding-agent/src/cli/config-selector.ts",
              'import { initTheme, stopThemeWatcher } from "../modes/interactive/theme/theme.ts";',
              'import { initTheme, stopThemeWatcher } from "../modes/interactive/theme/theme.ts";\nimport { createMainScreenTui } from "../utils/tui-runtime.ts";',
          )
          replace_once(
              "packages/coding-agent/src/cli/config-selector.ts",
              'const ui: TUI = new TuiMainScreen(new ProcessTerminal(), undefined, options.agentDir);',
              'const ui: TUI = createMainScreenTui(new ProcessTerminal(), undefined, options.agentDir);',
          )

          replace_once(
              "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
              '\ttype TUI,\n\tTuiAltScreen,\n\tTuiMainScreen,\n\tvisibleWidth,',
              '\ttype TUI,\n\tvisibleWidth,',
          )
          replace_once(
              "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
              'import { openBrowser } from "../../utils/open-browser.ts";',
              'import { openBrowser } from "../../utils/open-browser.ts";\nimport { createAltScreenTui, createMainScreenTui } from "../../utils/tui-runtime.ts";',
          )
          replace_once(
              "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
              '''export function createInteractiveTui(options: InteractiveTuiOptions): TUI {
          \tconst terminal = options.terminal ?? new ProcessTerminal();
          \tif (options.alt) {
          \t\treturn new TuiAltScreen(terminal, options.showHardwareCursor, options.logDirectory, { openUrl: openBrowser });
          \t}
          \treturn new TuiMainScreen(terminal, options.showHardwareCursor, options.logDirectory);
          }'''.replace("          ", ""),
              '''export function createInteractiveTui(options: InteractiveTuiOptions): TUI {
          \tconst terminal = options.terminal ?? new ProcessTerminal();
          \tif (options.alt) {
          \t\treturn createAltScreenTui(terminal, options.showHardwareCursor, options.logDirectory, { openUrl: openBrowser });
          \t}
          \treturn createMainScreenTui(terminal, options.showHardwareCursor, options.logDirectory);
          }'''.replace("          ", ""),
          )

          replace_once(
              "package.json",
              '\t\t"check:install-lock:coding-agent": "node scripts/generate-coding-agent-install-lock.mjs --check",',
              '\t\t"check:install-lock:coding-agent": "node scripts/generate-coding-agent-install-lock.mjs --check",\n\t\t"check:package-smoke": "node scripts/check-coding-agent-package-smoke.mjs",',
          )
          replace_once(
              "package.json",
              '\t\t"prepublishOnly": "npm run clean && npm run build && npm run check",',
              '\t\t"prepublishOnly": "npm run clean && npm run build && npm run check && npm run check:package-smoke",',
          )

          Path("scripts/check-coding-agent-package-smoke.mjs").write_text('''import { spawn } from "node:child_process";
          import { mkdtemp, mkdir, readdir, rm, writeFile } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import { dirname, join, resolve } from "node:path";
          import { fileURLToPath } from "node:url";

          const repoRoot = resolve(dirname(fileURLToPath(import.meta.url)), "..");
          const npmCommand = process.platform === "win32" ? "npm.cmd" : "npm";

          function run(command, args, cwd) {
          \treturn new Promise((resolvePromise, reject) => {
          \t\tconst child = spawn(command, args, { cwd, stdio: "inherit", env: process.env });
          \t\tchild.on("error", reject);
          \t\tchild.on("exit", (code, signal) => {
          \t\t\tif (code === 0) {
          \t\t\t\tresolvePromise();
          \t\t\t\treturn;
          \t\t\t}
          \t\t\treject(new Error(`${command} ${args.join(" ")} failed with ${signal ? `signal ${signal}` : `exit code ${code}`}`));
          \t\t});
          \t});
          }

          const temporaryRoot = await mkdtemp(join(tmpdir(), "pi-claude-package-smoke-"));
          const packDirectory = join(temporaryRoot, "pack");
          const installDirectory = join(temporaryRoot, "install");

          try {
          \tawait mkdir(packDirectory, { recursive: true });
          \tawait mkdir(installDirectory, { recursive: true });
          \tawait run(
          \t\tnpmCommand,
          \t\t["pack", "--workspace=@doubleflower/pi-claude", "--pack-destination", packDirectory, "--ignore-scripts"],
          \t\trepoRoot,
          \t);

          \tconst tarballs = (await readdir(packDirectory)).filter((entry) => entry.endsWith(".tgz"));
          \tif (tarballs.length !== 1) {
          \t\tthrow new Error(`Expected one coding-agent tarball, found ${tarballs.length}`);
          \t}

          \tawait writeFile(join(installDirectory, "package.json"), '{"private":true,"type":"module"}\n');
          \tawait run(
          \t\tnpmCommand,
          \t\t["install", "--ignore-scripts", "--no-audit", "--no-fund", join(packDirectory, tarballs[0])],
          \t\tinstallDirectory,
          \t);

          \tconst binary = join(
          \t\tinstallDirectory,
          \t\t"node_modules",
          \t\t".bin",
          \t\tprocess.platform === "win32" ? "pi-claude.cmd" : "pi-claude",
          \t);
          \tawait run(binary, ["--version"], installDirectory);
          } finally {
          \tawait rm(temporaryRoot, { recursive: true, force: true });
          }
          '''.replace("          ", ""))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Smoke-test packed npm artifact
        run: npm run check:package-smoke

      - name: Commit hotfix
        shell: bash
        run: |
          rm .github/workflows/hotfix-tui-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: support published pi-tui runtime in npm package"
          git push origin HEAD:hotfix/npm-tui-runtime-compat
