name: Monitor pi-claude v0.83.6 publish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monitor-publish-v0836.yml

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Wait for publish run
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --workflow publish-npm.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "No publish workflow run was found." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --exit-status || true
          gh run view "$run_id" --json databaseId,displayTitle,status,conclusion,createdAt,updatedAt,headSha,url,jobs > /tmp/publish-status.json

      - name: Record publish status
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/publish-status.json .github/publish-v0836-status.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/publish-v0836-status.json
          git commit -m "chore: record v0.83.6 publish status"
          git pull --rebase origin main
          git push origin HEAD:main
